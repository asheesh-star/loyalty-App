  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

:    '<path d=\"M3 18v-6a9 9 0 0 1 18 0v6\"/><path d=\"M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z\"/>',\n            'home':          '<path d=\"M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z\"/><polyline points=\"9 22 9 12 15 12 15 22\"/>',\n            'layout-grid':   '<rect x=\"3\" y=\"3\" width=\"7\" height=\"7\"/><rect x=\"14\" y=\"3\" width=\"7\" height=\"7\"/><rect x=\"14\" y=\"14\" width=\"7\" height=\"7\"/><rect x=\"3\" y=\"14\" width=\"7\" height=\"7\"/>',\n            'line-chart':    '<path d=\"M3 3v18h18\"/><path d=\"m19 9-5 5-4-4-3 3\"/>',\n            'map-pin':       '<path d=\"M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0z\"/><circle cx=\"12\" cy=\"10\" r=\"3\"/>',\n            'megaphone':     '<path d=\"m3 11 18-5v12L3 14v-3z\"/><path d=\"M11.6 16.8a3 3 0 1 1-5.8-1.6\"/>',\n            'percent':       '<line x1=\"19\" y1=\"5\" x2=\"5\" y2=\"19\"/><circle cx=\"6.5\" cy=\"6.5\" r=\"2.5\"/><circle cx=\"17.5\" cy=\"17.5\" r=\"2.5\"/>',\n            'settings':      '<path d=\"M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z\"/><circle cx=\"12\" cy=\"12\" r=\"3\"/>',\n            'shopping-bag':  '<path d=\"M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z\"/><line x1=\"3\" y1=\"6\" x2=\"21\" y2=\"6\"/><path d=\"M16 10a4 4 0 0 1-8 0\"/>',\n            'star':          '<polygon points=\"12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2\"/>',\n            'tag':            '<path d=\"M20.59 13.41 13.42 20.58a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z\"/><line x1=\"7\" y1=\"7\" x2=\"7.01\" y2=\"7\"/>',\n            'target':        '<circle cx=\"12\" cy=\"12\" r=\"10\"/><circle cx=\"12\" cy=\"12\" r=\"6\"/><circle cx=\"12\" cy=\"12\" r=\"2\"/>',\n            'ticket':        '<path d=\"M2 9a3 3 0 0 1 0 6v2a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-2a3 3 0 0 1 0-6V7a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2z\"/><path d=\"M13 5v2M13 17v2M13 11v2\"/>',\n            'trending-up':   '<polyline points=\"23 6 13.5 15.5 8.5 10.5 1 18\"/><polyline points=\"17 6 23 6 23 12\"/>',\n            'user-plus':     '<path d=\"M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2\"/><circle cx=\"8.5\" cy=\"7\" r=\"4\"/><line x1=\"20\" y1=\"8\" x2=\"20\" y2=\"14\"/><line x1=\"23\" y1=\"11\" x2=\"17\" y2=\"11\"/>',\n            'users':         '<path d=\"M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2\"/><circle cx=\"9\" cy=\"7\" r=\"4\"/><path d=\"M22 21v-2a4 4 0 0 0-3-3.87\"/><path d=\"M16 3.13a4 4 0 0 1 0 7.75\"/>',\n            'x':             '<line x1=\"18\" y1=\"6\" x2=\"6\" y2=\"18\"/><line x1=\"6\" y1=\"6\" x2=\"18\" y2=\"18\"/>'\n        };\n\n        function renderIconsFallback() {\n            document.querySelectorAll('i[data-lucide]').forEach(el => {\n                const name = el.getAttribute('data-lucide');\n                const body = inlineIcons[name];\n                if (!body) return;\n                const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');\n                svg.setAttribute('xmlns', 'http://www.w3.org/2000/svg');\n                svg.setAttribute('viewBox', '0 0 24 24');\n                svg.setAttribute('fill', 'none');\n                svg.setAttribute('stroke', 'currentColor');\n                svg.setAttribute('stroke-width', '2');\n                svg.setAttribute('stroke-linecap', 'round');\n                svg.setAttribute('stroke-linejoin', 'round');\n                svg.setAttribute('class', el.getAttribute('class') || '');\n                svg.innerHTML = body;\n                el.replaceWith(svg);\n            });\n        }\n\n        if (typeof lucide !== 'undefined' && typeof lucide.createIcons === 'function') {\n            try {\n                lucide.createIcons();\n            } catch (e) {\n                console.info('Lucide createIcons failed, using inline SVG fallback.', e);\n                renderIconsFallback();\n            }\n        } else {\n            console.info('Lucide icon library not available — using inline SVG fallback.');\n            renderIconsFallback();\n        }\n\n        // ----------------------------------------------------\n        // KPI values keyed by the preset\n        // ----------------------------------------------------\n        const kpiByPeriod = {\n            'Yesterday':          { totalSales: '$12,500', loyaltySales: '$4,800',  salesOffer: '$1,250',  redemptions: '$600',   loyaltyTrans: '124',   loyaltyAvg: '$38.70', spendLift: '25.68%', avgCheck: '$30.34', transCount: '412', redemptionCount: '48', nlCheck: '$30.79' },\n            'Today':              { totalSales: '$8,340',  loyaltySales: '$3,120',  salesOffer: '$820',    redemptions: '$405',   loyaltyTrans: '86',    loyaltyAvg: '$36.28', spendLift: '24.10%', avgCheck: '$29.68', transCount: '281', redemptionCount: '32', nlCheck: '$29.23' },\n            'This Week':          { totalSales: '$68,420', loyaltySales: '$26,140', salesOffer: '$6,825',  redemptions: '$3,350', loyaltyTrans: '672',   loyaltyAvg: '$38.90', spendLift: '25.20%', avgCheck: '$30.22', transCount: '2,264', redemptionCount: '268', nlCheck: '$31.07' },\n            'Last Week':          { totalSales: '$71,150', loyaltySales: '$27,220', salesOffer: '$7,105',  redemptions: '$3,485', loyaltyTrans: '698',   loyaltyAvg: '$38.99', spendLift: '25.40%', avgCheck: '$30.43', transCount: '2,338', redemptionCount: '279', nlCheck: '$31.09' },\n            'This Month':         { totalSales: '$198,750', loyaltySales: '$76,540', salesOffer: '$19,875', redemptions: '$9,750', loyaltyTrans: '1,968', loyaltyAvg: '$38.90', spendLift: '25.05%', avgCheck: '$30.16', transCount: '6,590', redemptionCount: '780', nlCheck: '$31.11' },\n            'Custom':             { totalSales: '$85,420', loyaltySales: '$32,760', salesOffer: '$8,540',  redemptions: '$4,180', loyaltyTrans: '842',   loyaltyAvg: '$38.90', spendLift: '25.20%', avgCheck: '$30.23', transCount: '2,826', redemptionCount: '334', nlCheck: '$31.07' }\n        };\n\n        let currentPreset = 'This Week';\n\n        function storeFactor() {\n            try {\n                if (!selectedStores || selectedStores.length === STORE_DEFS.length) return 1;\n                return STORE_DEFS.filter(s => selectedStores.includes(s.id)).reduce((a, s) => a + s.share, 0);\n            } catch (e) { return 1; }\n        }\n        function selectedStoreDefs() {\n            try { return (!selectedStores) ? STORE_DEFS : STORE_DEFS.filter(s => selectedStores.includes(s.id)); } catch (e) { return STORE_DEFS; }\n        }\n        const KPI_ADDITIVE = ['totalSales', 'loyaltySales', 'salesOffer', 'redemptions', 'loyaltyTrans', 'redemptionCount', 'transCount'];\n        const KPI_RATE = ['avgCheck', 'loyaltyAvg', 'spendLift', 'nlCheck'];\n        function scaleKpiText(text, mult) {\n            const m = /^(\\D*)([\\d,]+(?:\\.(\\d+))?)(\\D*)$/.exec(String(text).trim());\n            if (!m) return text;\n            const dec = m[3] ? m[3].length : 0;\n            const v = parseFloat(m[2].replace(/,/g, '')) * mult;\n            return m[1] + v.toLocaleString('en-US', { minimumFractionDigits: dec, maximumFractionDigits: dec }) + m[4];\n        }\n        function applyStoreScale() {\n            const f = storeFactor();\n            if (f === 1) return;\n            let seed = 0; selectedStoreDefs().forEach(s => { seed += s.id.charCodeAt(s.id.length - 1) + s.id.charCodeAt(s.id.length - 2); });\n            const rate = 1 + (((seed % 9) - 4) / 100);\n            document.querySelectorAll('[data-kpi],[data-kpi-wtd]').forEach(el => {\n                const k = el.getAttribute('data-kpi') || el.getAttribute('data-kpi-wtd');\n                if (KPI_ADDITIVE.includes(k)) el.textContent = scaleKpiText(el.textContent, f);\n                else if (KPI_RATE.includes(k)) el.textContent = scaleKpiText(el.textContent, rate);\n            });\n        }\n        function updateKpis() {\n            const data = kpiByPeriod[currentPreset] || kpiByPeriod['This Week'];\n            document.querySelectorAll('[data-kpi]').forEach(el => {\n                const k = el.getAttribute('data-kpi');\n                if (data[k] !== undefined) el.textContent = data[k];\n            });\n            const wtd = kpiByPeriod['This Week'] || {};\n            document.querySelectorAll('[data-kpi-wtd]').forEach(el => {\n                const k = el.getAttribute('data-kpi-wtd');\n                if (wtd[k] !== undefined) el.textContent = wtd[k];\n            });\n            applyStoreScale();\n            rollKpiNumbers();\n        }\n        function odoSettle(els) {\n            setTimeout(() => els.forEach(el => {\n                if (el.isConnected && el.querySelector('.odo-col')) el.textContent = el.getAttribute('aria-label');\n            }), 1500);\n        }\n        function odoChar(el, ch, i) {\n            if (!/\\d/.test(ch)) return '<span class=\"odo-c\" aria-hidden=\"true\">' + (ch === ' ' ? '&nbsp;' : ch) + '<\u002Fspan>';\n            return '<span class=\"odo-d\" aria-hidden=\"true\"><span class=\"odo-sz\">' + ch + '<\u002Fspan><span class=\"odo-col\" data-t=\"' + ch + '\" data-i=\"' + i + '\"><\u002Fspan><\u002Fspan>';\n        }\n        function rollTableNumbers() {\n            const cols = [], rolled = [];\n            document.querySelectorAll('#table-body td *').forEach(el => {\n                if (el.children.length || el.closest('svg') || !el.textContent) return;\n                const txt = el.textContent.trim();\n                if (!/^[+\\-]?\\$?[\\d,]+(\\.\\d+)?%?$/.test(txt)) return;\n                el.setAttribute('aria-label', txt);\n                el.innerHTML = Array.from(txt).map((ch, i) => odoChar(el, ch, i)).join('');\n                el.querySelectorAll('.odo-col').forEach(c => cols.push(c));\n                rolled.push(el);\n            });\n            odoSettle(rolled);\n            requestAnimationFrame(() => requestAnimationFrame(() => {\n                cols.forEach(c => {\n                    c.style.transitionDelay = (parseInt(c.dataset.i, 10) * 0.04) + 's';\n                    c.style.transform = 'translateY(' + (-parseInt(c.dataset.t, 10) * 1.1) + 'em)';\n                });\n            }));\n        }\n        function rollKpiNumbers() {\n            const cols = [], rolled = [];\n            document.querySelectorAll('[data-kpi],[data-kpi-wtd]').forEach(el => {\n                const txt = el.textContent.trim();\n                if (!txt) return;\n                el.dataset.val = txt;\n                el.setAttribute('aria-label', txt);\n                el.innerHTML = Array.from(txt).map((ch, i) => odoChar(el, ch, i)).join('');\n                el.querySelectorAll('.odo-col').forEach(c => cols.push(c));\n                rolled.push(el);\n            });\n            odoSettle(rolled);\n            requestAnimationFrame(() => requestAnimationFrame(() => {\n                cols.forEach(c => {\n                    c.style.transitionDelay = (parseInt(c.dataset.i, 10) * 0.05) + 's';\n                    c.style.transform = 'translateY(' + (-parseInt(c.dataset.t, 10) * 1.1) + 'em)';\n                });\n            }));\n        }\n\n        // ----------------------------------------------------\n        // KPI tile trend popover (graph icon on each KPI tile)\n        // ----------------------------------------------------\n        const kpiMeta = {\n            totalSales:   { label: 'Net Sales',          icon: 'dollar-sign',  color: '#ef4c5b', format: 'currency', base: 8340  },\n            loyaltySales: { label: 'Loyalty Sales',        icon: 'banknote',     color: '#f47a3d', format: 'currency', base: 3120  },\n            salesOffer:   { label: 'Sales with Offer',     icon: 'tag',          color: '#eab308', format: 'currency', base: 820   },\n            redemptions:  { label: 'Redemptions Amount',   icon: 'gift',         color: '#22a08a', format: 'currency', base: 405   },\n            loyaltyTrans: { label: 'Avg Check',            icon: 'hash',         color: '#2c8ec8', format: 'decimal',  base: 29.68 },\n            loyaltyAvg:   { label: 'Loyalty Avg. Check',   icon: 'target',       color: '#6b6ab9', format: 'decimal',  base: 36.28 },\n            spendLift:    { label: 'Spend Lift %',         icon: 'trending-up',  color: '#8b7fd6', format: 'percent',  base: 24.10 }\n        };\n\n        function formatKpiValue(fmt, v) {\n            if (fmt === 'currency') return '$' + Math.round(v).toLocaleString();\n            if (fmt === 'number')   return Math.round(v).toLocaleString();\n            if (fmt === 'decimal')  return '$' + v.toFixed(2);\n            if (fmt === 'percent')  return v.toFixed(2) + '%';\n            return String(v);\n        }\n\n        // Fixed accent used for the \"Last Period\" comparison series across\n        // every KPI chart, so it reads consistently regardless of the tile's\n        // own color — matches the dashed overlay line in the reference design.\n        const KPI_COMPARE_COLOR = '#7c9a46';\n\n        function generateKpiTrend(key) {\n            const meta = kpiMeta[key];\n            const days = 14;\n            const rng = seedRandom(hashStr(key));\n            const today = new Date();\n            const isRateMetric = (meta.format === 'decimal' || meta.format === 'percent');\n            const points = [];\n            for (let i = days - 1; i >= 0; i--) {\n                const d = new Date(today);\n                d.setDate(d.getDate() - i);\n                const dow = d.getDay();\n                const wkendBoost = (dow === 0 || dow === 6) ? 1.2 : 1;\n                const variance = isRateMetric ? (0.9 + rng() * 0.2) : (0.65 + rng() * 0.7) * wkendBoost;\n                points.push({ date: d, value: meta.base * variance });\n            }\n            // Anchor the last point to today's known value so the chart lines up with the tile\n            points[points.length - 1].value = meta.base;\n            return points;\n        }\n\n        // \"Last Period\" comparison trend — same shape logic, independently\n        // seeded so its wiggle diverges from the primary line (the two lines\n        // crossing is what gives the reference chart its look).\n        function generateKpiCompareTrend(key) {\n            const meta = kpiMeta[key];\n            const days = 14;\n            const rng = seedRandom(hashStr(key + '|cmp'));\n            const today = new Date();\n            const isRateMetric = (meta.format === 'decimal' || meta.format === 'percent');\n            const points = [];\n            for (let i = days - 1; i >= 0; i--) {\n                const d = new Date(today);\n                d.setDate(d.getDate() - i);\n                const dow = d.getDay();\n                const wkendBoost = (dow === 0 || dow === 6) ? 1.2 : 1;\n                const variance = isRateMetric ? (0.86 + rng() * 0.22) : (0.6 + rng() * 0.68) * wkendBoost;\n                points.push({ date: d, value: meta.base * variance * 0.93 });\n            }\n            return points;\n        }\n\n        // ----------------------------------------------------\n        // Mini sparkline rendered inside each KPI tile — single filled\n        // trend line with a dashed average reference line. Kept simple on\n        // the tile itself; the richer dual-line \"This Period vs Last\n        // Period\" chart lives in the click-through trend popover instead\n        // (see renderKpiTrendChart / openKpiTrend below).\n        // ----------------------------------------------------\n        function renderKpiTileSparkline(key) {\n            const meta = kpiMeta[key];\n            const container = document.getElementById('kpi-spark-' + key);\n            if (!meta || !container) return;\n            const points = generateKpiTrend(key);\n            const vals = points.map(p => p.value);\n            const n = vals.length;\n            const W = 220, H = 40, pad = 2;\n            const cW = W - pad * 2, cH = H - pad * 2;\n            const maxV = Math.max(...vals) * 1.08 || 1;\n            const minV = Math.min(...vals) * 0.9;\n            const range = (maxV - minV) || 1;\n            const xAt = i => pad + (i / (n - 1 || 1)) * cW;\n            const yAt = v => pad + cH * (1 - (v - minV) / range);\n\n            const linePath = vals.map((v, i) => (i === 0 ? 'M' : 'L') + xAt(i).toFixed(1) + ',' + yAt(v).toFixed(1)).join(' ');\n            const areaPath = linePath + ' L' + xAt(n - 1).toFixed(1) + ',' + (H - pad).toFixed(1) + ' L' + xAt(0).toFixed(1) + ',' + (H - pad).toFixed(1) + ' Z';\n\n            // Dashed reference line at the trend's average\n            const avg = vals.reduce((a, b) => a + b, 0) / n;\n            const refY = yAt(avg).toFixed(1);\n\n            let svg = '<svg viewBox=\"0 0 ' + W + ' ' + H + '\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;height:100%;\" preserveAspectRatio=\"none\">';\n            svg += '<path d=\"' + areaPath + '\" fill=\"' + meta.color + '\" opacity=\"0.12\"/>';\n            svg += '<line x1=\"' + pad + '\" y1=\"' + refY + '\" x2=\"' + (W - pad) + '\" y2=\"' + refY + '\" stroke=\"#cbd0d6\" stroke-width=\"1\" stroke-dasharray=\"3,3\"/>';\n            svg += '<path d=\"' + linePath + '\" fill=\"none\" stroke=\"' + meta.color + '\" stroke-width=\"1.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>';\n            const lastX = xAt(n - 1), lastY = yAt(vals[n - 1]);\n            svg += '<circle cx=\"' + lastX.toFixed(1) + '\" cy=\"' + lastY.toFixed(1) + '\" r=\"2.5\" fill=\"' + meta.color + '\" stroke=\"white\" stroke-width=\"1\"/>';\n            svg += '<\u002Fsvg>';\n            container.innerHTML = svg;\n            container.style.cursor = 'pointer';\n            container.title = 'View trend';\n            container.onclick = (e) => { e.stopPropagation(); openKpiMetricTrend(key); };\n        }\n\n        // Tile sparkline -> same Metric Trend modal used by the table sparklines,\n        // anchored to the tile's displayed value.\n        function openKpiMetricTrend(key) {\n            const meta = kpiMeta[key];\n            if (!meta) return;\n            const el = document.querySelector('[data-kpi=\"' + key + '\"]');\n            const base = (el && parseFloat((el.dataset.val || el.textContent).replace(/[^0-9.\\-]/g, ''))) || meta.base;\n            const fmt = { currency: 'money', number: 'count', decimal: 'moneyc', percent: 'percent' }[meta.format] || 'count';\n            openMetricTrend('kpi:' + key, meta.label, 'All stores', meta.color, fmt, base);\n            metricTrendState.kpi = { rate: meta.format === 'decimal' || meta.format === 'percent' };\n            renderMetricTrend();\n        }\n\n        function renderKpiTileSparklines() {\n            Object.keys(kpiMeta).forEach(renderKpiTileSparkline);\n        }\n\n        function renderKpiTrendChart(key) {\n            const meta = kpiMeta[key];\n            const points = generateKpiTrend(key);\n            const cmpPoints = generateKpiCompareTrend(key);\n            const container = document.getElementById('kpi-trend-chart');\n            const W = 540, H = 220, pL = 46, pR = 16, pT = 40, pB = 28;\n            const cW = W - pL - pR, cH = H - pT - pB;\n            const n = points.length;\n            const allVals = points.map(p => p.value).concat(cmpPoints.map(p => p.value));\n            const maxV = Math.max(...allVals) * 1.2 || 1;\n            const minV = 0;\n            const xOf = i => pL + (i / (n-1||1)) * cW;\n            const yOf = v => pT + cH * (1 - v / maxV);\n\n            let svg = '<svg viewBox=\"0 0 '+W+' '+H+'\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;height:100%;\" preserveAspectRatio=\"xMidYMid meet\">';\n\n            // Grid + Y labels\n            for (let i = 0; i <= 3; i++) {\n                const y = pT + cH * (1 - i/3);\n                const v = minV + (maxV - minV) * i/3;\n                svg += '<line x1=\"'+pL+'\" y1=\"'+y+'\" x2=\"'+(W-pR)+'\" y2=\"'+y+'\" stroke=\"#f3f4f6\" stroke-dasharray=\"4,3\"/>';\n                svg += '<text x=\"'+(pL-8)+'\" y=\"'+(y+4)+'\" text-anchor=\"end\" fill=\"#9ca3af\" font-size=\"9.5\" font-family=\"Inter,sans-serif\">'+formatKpiValue(meta.format, v)+'<\u002Ftext>';\n            }\n\n            // X labels (every ~3rd day + last)\n            const labelEvery = Math.max(1, Math.ceil(n / 6));\n            const dow = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];\n            points.forEach(function(p, i) {\n                if (i % labelEvery === 0 || i === n-1) {\n                    const x = xOf(i);\n                    svg += '<text x=\"'+x+'\" y=\"'+(H-pB+18)+'\" text-anchor=\"middle\" fill=\"#9ca3af\" font-size=\"9.5\" font-family=\"Inter,sans-serif\">'+dow[p.date.getDay()]+'<\u002Ftext>';\n                }\n            });\n\n            // Area fill (primary)\n            let areaPath = points.map(function(p, i) {\n                return (i===0?'M':'L')+xOf(i).toFixed(1)+','+yOf(p.value).toFixed(1);\n            }).join(' ');\n            areaPath += ' L'+xOf(n-1).toFixed(1)+','+(pT+cH).toFixed(1)+' L'+xOf(0).toFixed(1)+','+(pT+cH).toFixed(1)+' Z';\n            svg += '<path d=\"'+areaPath+'\" fill=\"'+meta.color+'\" opacity=\"0.08\"/>';\n\n            // Primary line\n            let linePath = points.map(function(p, i) {\n                return (i===0?'M':'L')+xOf(i).toFixed(1)+','+yOf(p.value).toFixed(1);\n            }).join(' ');\n            svg += '<path d=\"'+linePath+'\" fill=\"none\" stroke=\"'+meta.color+'\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>';\n\n            // Primary dots (last point emphasized)\n            points.forEach(function(p, i) {\n                const isLast = (i === n-1);\n                svg += '<circle cx=\"'+xOf(i).toFixed(1)+'\" cy=\"'+yOf(p.value).toFixed(1)+'\" r=\"'+(isLast?4:2.5)+'\" fill=\"'+meta.color+'\" stroke=\"white\" stroke-width=\"'+(isLast?2:1.5)+'\"/>';\n            });\n\n            // Secondary \"Last Period\" dashed comparison line + dots\n            let cmpLinePath = cmpPoints.map(function(p, i) {\n                return (i===0?'M':'L')+xOf(i).toFixed(1)+','+yOf(p.value).toFixed(1);\n            }).join(' ');\n            svg += '<path d=\"'+cmpLinePath+'\" fill=\"none\" stroke=\"'+KPI_COMPARE_COLOR+'\" stroke-width=\"2\" stroke-dasharray=\"5,3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>';\n            cmpPoints.forEach(function(p, i) {\n                const isLast = (i === n-1);\n                svg += '<circle cx=\"'+xOf(i).toFixed(1)+'\" cy=\"'+yOf(p.value).toFixed(1)+'\" r=\"'+(isLast?3.5:2.2)+'\" fill=\"'+KPI_COMPARE_COLOR+'\" stroke=\"white\" stroke-width=\"1.25\"/>';\n            });\n\n            // In-chart legend chips (dot + label + value), mirroring the\n            // reference screenshot's floating series labels\n            const curVal = formatKpiValue(meta.format, points[n-1].value);\n            const cmpVal = formatKpiValue(meta.format, cmpPoints[n-1].value);\n            const cmpLastVal = cmpPoints[n-1].value || 1;\n            const pctDiff = ((points[n-1].value - cmpLastVal) / cmpLastVal) * 100;\n            const pctStr = (pctDiff >= 0 ? '+' : '') + pctDiff.toFixed(1) + '%';\n\n            svg += '<circle cx=\"'+(pL+4)+'\" cy=\"14\" r=\"4\" fill=\"'+meta.color+'\"/>';\n            svg += '<text x=\"'+(pL+12)+'\" y=\"18\" font-size=\"11\" font-weight=\"700\" fill=\"#1f2937\" font-family=\"Inter,sans-serif\">This Period<\u002Ftext>';\n            svg += '<text x=\"'+(pL+12+68)+'\" y=\"18\" font-size=\"11\" font-weight=\"600\" fill=\"#6b7280\" font-family=\"Inter,sans-serif\">'+curVal+'<\u002Ftext>';\n\n            const legend2X = W - pR - 150;\n            svg += '<circle cx=\"'+legend2X+'\" cy=\"14\" r=\"4\" fill=\"'+KPI_COMPARE_COLOR+'\"/>';\n            svg += '<text x=\"'+(legend2X+8)+'\" y=\"18\" font-size=\"11\" font-weight=\"700\" fill=\"#1f2937\" font-family=\"Inter,sans-serif\">Last Period<\u002Ftext>';\n            svg += '<text x=\"'+(legend2X+8+72)+'\" y=\"18\" font-size=\"11\" font-weight=\"600\" fill=\"'+(pctDiff>=0?'#059669':'#dc2626')+'\" font-family=\"Inter,sans-serif\">'+cmpVal+' '+pctStr+'<\u002Ftext>';\n\n            svg += '<\u002Fsvg>';\n            container.innerHTML = svg;\n        }\n\n        function openKpiTrend(key) {\n            const meta = kpiMeta[key];\n            if (!meta) return;\n            document.getElementById('kpi-trend-title').textContent = meta.label + ' — Trend';\n            const iconBg = document.getElementById('kpi-trend-icon');\n            iconBg.style.background = meta.color + '1a';\n            iconBg.innerHTML = '<i data-lucide=\"'+meta.icon+'\" class=\"w-4 h-4\" style=\"color:'+meta.color+';\"><\u002Fi>';\n            document.getElementById('kpi-trend-modal').classList.remove('hidden');\n            renderKpiTrendChart(key);\n            if (typeof lucide !== 'undefined' && typeof lucide.createIcons === 'function') {\n                try { lucide.createIcons(); } catch (e) { renderIconsFallback(); }\n            } else {\n                renderIconsFallback();\n            }\n        }\n\n        function closeKpiTrend() {\n            document.getElementById('kpi-trend-modal').classList.add('hidden');\n        }\n\n        document.addEventListener('keydown', (e) => {\n            if (e.key === 'Escape') {\n                const modal = document.getElementById('kpi-trend-modal');\n                if (modal && !modal.classList.contains('hidden')) closeKpiTrend();\n            }\n        });\n\n        // ----------------------------------------------------\n        // Preset options panel\n        // ----------------------------------------------------\n        function togglePresetPanel(e) {\n            if (e) e.stopPropagation();\n            const panel = document.getElementById('preset-panel');\n            const isOpen = !panel.classList.contains('hidden');\n            // Close calendar if it's open\n            document.getElementById('calendar-panel').classList.add('hidden');\n            if (isOpen) {\n                panel.classList.add('hidden');\n            } else {\n                // Sync radios to current state each time we open\n                document.querySelectorAll('.preset-radio').forEach(r => {\n                    r.checked = (r.value === currentPreset);\n                });\n                panel.classList.remove('hidden');\n            }\n        }\n\n        function applyPreset() {\n            const selected = document.querySelector('.preset-radio:checked');\n            const value = selected ? selected.value : 'This Week';\n            currentPreset = value;\n            document.getElementById('preset-label').textContent = value;\n            document.getElementById('preset-panel').classList.add('hidden');\n            updateKpis();\n            setDatePickerEnabled(value === 'Custom');\n            onDateRangeChanged();\n        }\n\n        // ----------------------------------------------------\n        // Active date range — drives the Campaign / Offers table.\n        // Presets resolve relative to the dashboard's \"today\"\n        // (current date in America/Los_Angeles). Custom uses\n        // the week picked in the calendar / stepped with < >.\n        // ----------------------------------------------------\n        const DASH_TODAY = (() => {\n            const p = new Intl.DateTimeFormat('en-US', { timeZone: 'America/Los_Angeles', year: 'numeric', month: 'numeric', day: 'numeric' }).formatToParts(new Date());\n            const g = t => parseInt(p.find(x => x.type === t).value, 10);\n            return new Date(g('year'), g('month') - 1, g('day'));\n        })();\n        let customRange = (() => { const ws = new Date(DASH_TODAY); ws.setDate(ws.getDate() - ws.getDay() - 7); const we = new Date(ws); we.setDate(we.getDate() + 6); return { from: ws, to: we }; })();\n\n        function addDays(d, n) { const x = new Date(d); x.setDate(x.getDate() + n); return x; }\n        function fmtMDY(dt) { return `${String(dt.getMonth()+1).padStart(2,'0')}/${String(dt.getDate()).padStart(2,'0')}/${dt.getFullYear()}`; }\n\n        function getActiveRange() {\n            const t = DASH_TODAY;\n            const weekStart = addDays(t, -t.getDay()); // Sunday of this week\n            switch (currentPreset) {\n                case 'Today':      return { from: t, to: t };\n                case 'Yesterday':  return { from: addDays(t, -1), to: addDays(t, -1) };\n                case 'This Week':  return { from: weekStart, to: t };\n                case 'Last Week':  return { from: addDays(weekStart, -7), to: addDays(weekStart, -1) };\n                case 'This Month': return { from: new Date(t.getFullYear(), t.getMonth(), 1), to: t };\n                case 'Custom':     return { from: customRange.from, to: customRange.to };\n                default:           return { from: weekStart, to: t };\n            }\n        }\n\n        function updateDateDisplay() {\n            const r = getActiveRange();\n            document.getElementById('date-display').textContent =\n                isSameDay(r.from, r.to) ? fmtMDY(r.from) : `${fmtMDY(r.from)} - ${fmtMDY(r.to)}`;\n            const dc = document.getElementById('days-count');\n            if (dc) { const n = Math.round((r.to - r.from) / 864e5) + 1; dc.textContent = n + (n === 1 ? ' day' : ' days'); }\n        }\n\n        // Custom-mode stepper: move the selected range by one week.\n        function shiftCustomRange(dir) {\n            if (currentPreset !== 'Custom') return;\n            customRange = { from: addDays(customRange.from, 7 * dir), to: addDays(customRange.to, 7 * dir) };\n            selectedWeek = null;\n            calYear = customRange.from.getFullYear(); calMonth = customRange.from.getMonth();\n            onDateRangeChanged();\n        }\n\n        // Re-render everything that depends on the active range.\n        function onDateRangeChanged() {\n            updateDateDisplay();\n            paginationState.page = 1;\n            // If the drilled-into campaign/offer has no activity in the new range, go back to the root list.\n            if (drillPath.some(s => s.ctx && s.ctx.rootId && !getRootRow(s.ctx.rootId))) drillPath = [];\n            renderBreadcrumb();\n            renderTable();\n        }\n\n        function clearPreset() {\n            document.querySelectorAll('.preset-radio').forEach(r => { r.checked = false; });\n            const thisWeek = document.querySelector('.preset-radio[value=\"This Week\"]');\n            if (thisWeek) thisWeek.checked = true;\n        }\n\n        function setDatePickerEnabled(enabled) {\n            const btn = document.getElementById('date-picker-btn');\n            const prev = document.getElementById('date-prev');\n            const next = document.getElementById('date-next');\n            [prev, next].forEach(b => {\n                b.disabled = !enabled;\n                if (enabled) {\n                    b.className = 'w-10 h-10 border border-gray-200 rounded-full hover:bg-gray-50 transition flex items-center justify-center shadow-sm bg-white text-gray-600';\n                } else {\n                    b.className = 'w-10 h-10 border border-gray-200 rounded-full transition flex items-center justify-center shadow-sm bg-gray-50 text-gray-300 cursor-not-allowed';\n                }\n            });\n            btn.disabled = !enabled;\n            if (enabled) {\n                btn.className = 'flex items-center gap-2 pl-4 pr-10 py-2 border border-gray-200 rounded-full text-sm font-semibold min-w-[220px] shadow-sm bg-white text-gray-700 hover:bg-gray-50 transition cursor-pointer';\n            } else {\n                btn.className = 'flex items-center gap-2 pl-4 pr-10 py-2 border border-gray-200 rounded-full text-sm font-semibold min-w-[220px] shadow-sm bg-gray-50 text-gray-400 cursor-not-allowed';\n                // Also close calendar if it was open\n                document.getElementById('calendar-panel').classList.add('hidden');\n            }\n        }\n\n        // ----------------------------------------------------\n        // Week-range calendar\n        // ----------------------------------------------------\n        const monthNames = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];\n        // Anchor month/year the calendar is currently viewing\n        let calYear = DASH_TODAY.getFullYear(), calMonth = DASH_TODAY.getMonth();\n        // The selected week — array of 7 Date objects (Sun..Sat)\n        let selectedWeek = null;\n\n        function toggleCalendar(e) {\n            if (e) e.stopPropagation();\n            const btn = document.getElementById('date-picker-btn');\n            if (btn.disabled) return;\n            const panel = document.getElementById('calendar-panel');\n            // Close preset panel if it's open\n            document.getElementById('preset-panel').classList.add('hidden');\n            panel.classList.toggle('hidden');\n            if (!panel.classList.contains('hidden')) renderCalendar();\n        }\n\n        function calStep(delta) {\n            calMonth += delta;\n            if (calMonth < 0)   { calMonth = 11; calYear--; }\n            if (calMonth > 11)  { calMonth = 0;  calYear++; }\n            renderCalendar();\n        }\n\n        function getWeekFor(dateObj) {\n            // Returns array of 7 Date objects representing Sun..Sat containing this date\n            const d = new Date(dateObj);\n            const dow = d.getDay(); // 0 = Sun\n            d.setDate(d.getDate() - dow);\n            const week = [];\n            for (let i = 0; i < 7; i++) {\n                const w = new Date(d);\n                w.setDate(d.getDate() + i);\n                week.push(w);\n            }\n            return week;\n        }\n\n        function isSameDay(a, b) {\n            return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();\n        }\n\n        function renderCalendar() {\n            document.getElementById('cal-month-text').textContent = `${monthNames[calMonth]} ${calYear}`;\n            const first = new Date(calYear, calMonth, 1);\n            const startDow = first.getDay();\n            const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();\n            const grid = document.getElementById('cal-grid');\n            grid.innerHTML = '';\n\n            // Fill leading days (previous month)\n            const prevMonthDays = new Date(calYear, calMonth, 0).getDate();\n            for (let i = startDow - 1; i >= 0; i--) {\n                const dayNum = prevMonthDays - i;\n                const cell = document.createElement('div');\n                cell.className = 'cal-day cal-out';\n                cell.textContent = dayNum;\n                grid.appendChild(cell);\n            }\n\n            // Current month days\n            for (let d = 1; d <= daysInMonth; d++) {\n                const cellDate = new Date(calYear, calMonth, d);\n                const cell = document.createElement('div');\n                cell.className = 'cal-day';\n                cell.textContent = d;\n                cell.dataset.day = d;\n\n                if (selectedWeek) {\n                    const isInWeek = selectedWeek.some(w => isSameDay(w, cellDate));\n                    if (isInWeek) {\n                        cell.classList.add('cal-week-range');\n                        if (isSameDay(cellDate, selectedWeek[0])) cell.classList.add('cal-week-first');\n                        if (isSameDay(cellDate, selectedWeek[6])) cell.classList.add('cal-week-last');\n                        // Anchor day (the day the user actually clicked, we mark middle-of-week visually as solid)\n                        // For a simple UX, mark the last day of the week bold as the \"primary\" - matches the reference vibe\n                    }\n                }\n\n                cell.addEventListener('click', () => {\n                    const clicked = new Date(calYear, calMonth, d);\n                    selectedWeek = getWeekFor(clicked);\n                    // Apply the picked week as the custom range (updates label + table)\n                    customRange = { from: selectedWeek[0], to: selectedWeek[6] };\n                    onDateRangeChanged();\n                    renderCalendar();\n                    // Auto-close a moment later\n                    setTimeout(() => document.getElementById('calendar-panel').classList.add('hidden'), 250);\n                });\n                grid.appendChild(cell);\n            }\n\n            // Trailing days to fill to 6 rows (42 cells) — keeps layout stable\n            const totalSoFar = startDow + daysInMonth;\n            const trailing = (7 - (totalSoFar % 7)) % 7;\n            for (let i = 1; i <= trailing; i++) {\n                const cell = document.createElement('div');\n                cell.className = 'cal-day cal-out';\n                cell.textContent = i;\n                grid.appendChild(cell);\n            }\n        }\n\n        // ----------------------------------------------------\n        // Shared date-range calendar (Campaign Detail + Offer Detail)\n        // Lets the user click a start date then an end date in a single\n        // calendar, instead of two separate native date pickers.\n        // ----------------------------------------------------\n        let rangeCalContext = null;   // 'campaign' | 'offer'\n        let rangeCalYear = DASH_TODAY.getFullYear(), rangeCalMonth = DASH_TODAY.getMonth();\n        let rangeStart = null, rangeEnd = null; // Date objects\n\n        function openRangeCalendar(context, e) {\n            if (e) e.stopPropagation();\n            rangeCalContext = context;\n            const fromId = context === 'campaign' ? 'cd-date-from' : 'od-date-from';\n            const toId   = context === 'campaign' ? 'cd-date-to'   : 'od-date-to';\n            const fromVal = document.getElementById(fromId).value;\n            const toVal   = document.getElementById(toId).value;\n            rangeStart = fromVal ? new Date(fromVal + 'T00:00:00') : null;\n            rangeEnd   = toVal   ? new Date(toVal + 'T00:00:00')   : null;\n            if (rangeStart) { rangeCalYear = rangeStart.getFullYear(); rangeCalMonth = rangeStart.getMonth(); }\n\n            // Close the other dropdown-style popovers if open\n            const presetPanel = document.getElementById('preset-panel');\n            const calPanel = document.getElementById('calendar-panel');\n            if (presetPanel) presetPanel.classList.add('hidden');\n            if (calPanel) calPanel.classList.add('hidden');\n\n            const btn = document.getElementById(context === 'campaign' ? 'cd-daterange-btn' : 'od-daterange-btn');\n            const popover = document.getElementById('range-cal-popover');\n            const rect = btn.getBoundingClientRect();\n            const popW = 300;\n            let left = rect.left;\n            if (left + popW > window.innerWidth - 12) left = Math.max(12, window.innerWidth - popW - 12);\n            popover.style.top = (rect.bottom + 8) + 'px';\n            popover.style.left = left + 'px';\n\n            popover.classList.remove('hidden');\n            renderRangeCalendar();\n        }\n\n        function closeRangeCalendar() {\n            document.getElementById('range-cal-popover').classList.add('hidden');\n        }\n\n        function rangeCalStep(delta) {\n            rangeCalMonth += delta;\n            if (rangeCalMonth < 0)  { rangeCalMonth = 11; rangeCalYear--; }\n            if (rangeCalMonth > 11) { rangeCalMonth = 0;  rangeCalYear++; }\n            renderRangeCalendar();\n        }\n\n        function writeRangeToInputs() {\n            if (!rangeStart || !rangeEnd || !rangeCalContext) return;\n            const fromId = rangeCalContext === 'campaign' ? 'cd-date-from' : 'od-date-from';\n            const toId   = rangeCalContext === 'campaign' ? 'cd-date-to'   : 'od-date-to';\n            const displayId = rangeCalContext === 'campaign' ? 'cd-daterange-display' : 'od-daterange-display';\n            document.getElementById(fromId).value = toISODate(rangeStart);\n            document.getElementById(toId).value   = toISODate(rangeEnd);\n            const fmt = dt => `${String(dt.getMonth()+1).padStart(2,'0')}/${String(dt.getDate()).padStart(2,'0')}/${dt.getFullYear()}`;\n            document.getElementById(displayId).textContent = `${fmt(rangeStart)} - ${fmt(rangeEnd)}`;\n        }\n\n        function renderRangeCalendar() {\n            document.getElementById('range-cal-month-text').textContent = `${monthNames[rangeCalMonth]} ${rangeCalYear}`;\n            const first = new Date(rangeCalYear, rangeCalMonth, 1);\n            const startDow = first.getDay();\n            const daysInMonth = new Date(rangeCalYear, rangeCalMonth + 1, 0).getDate();\n            const grid = document.getElementById('range-cal-grid');\n            grid.innerHTML = '';\n\n            const hint = document.getElementById('range-cal-hint');\n            if (!rangeStart) hint.textContent = 'Select a start date';\n            else if (!rangeEnd) hint.textContent = 'Now select an end date';\n            else hint.textContent = 'Click Apply to confirm, or pick a new start date';\n\n            // Leading days (previous month)\n            const prevMonthDays = new Date(rangeCalYear, rangeCalMonth, 0).getDate();\n            for (let i = startDow - 1; i >= 0; i--) {\n                const cell = document.createElement('div');\n                cell.className = 'range-day range-out';\n                cell.textContent = prevMonthDays - i;\n                grid.appendChild(cell);\n            }\n\n            // Current month days\n            for (let d = 1; d <= daysInMonth; d++) {\n                const cellDate = new Date(rangeCalYear, rangeCalMonth, d);\n                const cell = document.createElement('div');\n                cell.className = 'range-day';\n                cell.textContent = d;\n\n                const isStart = rangeStart && isSameDay(cellDate, rangeStart);\n                const isEnd   = rangeEnd   && isSameDay(cellDate, rangeEnd);\n                const inBetween = rangeStart && rangeEnd && cellDate > rangeStart && cellDate < rangeEnd;\n\n                if (isStart || isEnd) {\n                    cell.classList.add('range-anchor');\n                } else if (inBetween) {\n                    cell.classList.add('range-in');\n                }\n                if (rangeStart && rangeEnd) {\n                    if (isSameDay(cellDate, rangeStart)) cell.classList.add('range-in-first');\n                    if (isSameDay(cellDate, rangeEnd))   cell.classList.add('range-in-last');\n                }\n\n                cell.addEventListener('click', () => {\n                    const clicked = new Date(rangeCalYear, rangeCalMonth, d);\n                    if (!rangeStart || rangeEnd) {\n                        // Starting a fresh selection\n                        rangeStart = clicked;\n                        rangeEnd = null;\n                    } else if (clicked < rangeStart) {\n                        // Clicked before the start — swap so start is always earlier\n                        rangeEnd = rangeStart;\n                        rangeStart = clicked;\n                        writeRangeToInputs();\ rom = sh(r.from); r.to = sh(r.to); });\n        })();\n\n        // ----------------------------------------------------\n        // Drill-down data model: (Campaign | Offer) -> Store -> Week -> Day\n        // Both toggle paths share this exact logic. Figures are generated\n        // deterministically per row + date range, and every level foots\n        // back to its parent's totals.\n        // ----------------------------------------------------\n        function sumField(rows, key) { return rows.reduce((acc, r) => acc + r[key], 0); }\n\n        const STORE_DEFS = [\n            { id: 'ST-0871', name: 'Store 0871', sub: 'Harbor Point', share: 0.21 },\n            { id: 'ST-0412', name: 'Store 0412', sub: 'Fillmore & Grove', share: 0.18 },\n            { id: 'ST-0965', name: 'Store 0965', sub: 'Riverside Plaza', share: 0.15 },\n            { id: 'ST-1128', name: 'Store 1128', sub: 'Oak Hollow Commons', share: 0.14 },\n            { id: 'ST-0539', name: 'Store 0539', sub: 'Lakeview Crossing', share: 0.12 },\n            { id: 'ST-1304', name: 'Store 1304', sub: 'Maple & 5th', share: 0.11 },\n            { id: 'ST-0786', name: 'Store 0786', sub: 'Westgate Market', share: 0.09 }\n        ];\n        const STORE_FRANCHISE = { 'ST-0871': 'Plum Coastal Group', 'ST-0412': 'Plum Coastal Group', 'ST-0965': 'Riverbend Hospitality', 'ST-1128': 'Riverbend Hospitality', 'ST-0539': 'Northshore Foods', 'ST-1304': 'Northshore Foods', 'ST-0786': 'Westgate Partners LLC' };\n        // Relative sales weight by day of week (index = Date.getDay(), Sun..Sat)\n        const DOW_WEIGHT = [0.12, 0.12, 0.13, 0.14, 0.15, 0.18, 0.16];\n        const DOW_SHORT = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];\n        const MON_SHORT = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];\n        const METRIC_KEYS = ['users', 'loyaltyTrans', 'loyaltySales', 'salesOffer', 'redemptionCount', 'redemptionAmount', 'reached', 'netSales'];\n        // Metrics that scale with the
