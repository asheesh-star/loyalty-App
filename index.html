pSales) * 100).toFixed(1) + '% of campaign sales');\n            S('cd-rev-trans', campTrans.toLocaleString(), 'Attributed to campaign');\n            S('cd-rev-avgcheck', '$' + (campSales / campTrans).toFixed(2), 'Sales / transactions');\n            const reached = au.reached;\n            const rPct = Math.min(100, (reached / row.users) * 100), dPct = Math.min(100, (row.redemptionCount / row.users) * 100);\n            S('cd-aud-targeted', row.users.toLocaleString(), 'Selected for campaign');\n            S('cd-aud-reached', reached.toLocaleString(), rPct.toFixed(1) + '% of targeted');\n            S('cd-aud-redemptions', row.redemptionCount.toLocaleString(), dPct.toFixed(1) + '% of targeted');\n            S('cd-aud-redrate', ((row.redemptionCount / reached) * 100).toFixed(1) + '%', 'Redemptions / reached');\n            document.getElementById('cd-aud-reached-bar').style.width = rPct + '%';\n            document.getElementById('cd-aud-redemptions-bar').style.width = dPct + '%';\n            document.getElementById('cd-aud-reached-pct').textContent = rPct.toFixed(1) + '%';\n            document.getElementById('cd-aud-redeemed-pct').textContent = dPct.toFixed(1) + '%';\n\n            // Generate daily data & render charts\n            activeDailyData = generateDailyData(row.from, row.to, row);\n            // Always start the Loyalty card in chart view\n            loyaltyView = 'chart';\n            document.getElementById('cd-lst-chart-wrap').classList.remove('hidden');\n            document.getElementById('cd-lst-table-wrap').classList.add('hidden');\n            document.getElementById('cd-lst-toggle-icon').innerHTML = '<rect x=\"1\" y=\"1\" width=\"7\" height=\"7\" rx=\"1.5\" stroke=\"#6b7280\" stroke-width=\"1.5\" fill=\"none\"/><rect x=\"10\" y=\"1\" width=\"7\" height=\"7\" rx=\"1.5\" stroke=\"#6b7280\" stroke-width=\"1.5\" fill=\"none\"/><rect x=\"1\" y=\"10\" width=\"7\" height=\"7\" rx=\"1.5\" stroke=\"#6b7280\" stroke-width=\"1.5\" fill=\"none\"/><rect x=\"10\" y=\"10\" width=\"7\" height=\"7\" rx=\"1.5\" stroke=\"#6b7280\" stroke-width=\"1.5\" fill=\"none\"/>';\n            resetComboView('cd-perf'); resetComboView('cd-visits'); resetComboView('cd-delivery');\n            renderAllCampaignCharts(activeDailyData);\n\n            // Delivery chart\n            renderDelivery(detail.delivery);\n\n            // Show/hide\n            document.getElementById('dashboard-home').classList.add('hidden');\n            document.getElementById('campaign-detail').classList.remove('hidden');\n            if (typeof lucide !== 'undefined' && typeof lucide.createIcons === 'function') {\n                try { lucide.createIcons(); } catch(e) { renderIconsFallback(); }\n            } else { renderIconsFallback(); }\n            document.querySelector('#view-dashboard main').scrollTop = 0;\n        }\n\n        function applyCampaignDateRange() {\n            if (!activeCampaignId) return;\n            const row = campaignRows.find(r => r.id === activeCampaignId);\n            if (!row) return;\n            const fromVal = document.getElementById('cd-date-from').value;\n            const toVal = document.getElementById('cd-date-to').value;\n            if (!fromVal || !toVal) return;\n            const from = new Date(fromVal), to = new Date(toVal);\n            // Filter daily data to the selected range\n            const filtered = activeDailyData.filter(d => d.date >= from && d.date <= to);\n            renderAllCampaignCharts(filtered);\n        }\n\n\n        // ===== Reusable Analytics Trend Card (config + data driven) =====\n        const ATC_COLORS = { primary:'#2FA3E0', primary2:'#9BD3F1', secondary:'#171717', tertiary:'#FF0F68' };\n        function AnalyticsTrendCard(el, cfg) {\n            const st = el._atc || (el._atc = { range: cfg.activeRange || cfg.timeRanges[0], view: 'chart' });\n            if (!cfg.timeRanges.includes(st.range)) st.range = cfg.activeRange || cfg.timeRanges[0];\n            const n = { '7D':7, '14D':14, '1M':30 };\n            const rows = cfg.data.slice(-(n[st.range] || cfg.data.length));\n            const fmt = (s, v) => (s.prefix||'') + Number(v).toLocaleString(undefined,{maximumFractionDigits:s.decimals||0}) + (s.suffix||'');\n            const mon = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];\n            const lab = d => mon[d.getMonth()] + ' ' + d.getDate();\n            const colOf = s => ATC_COLORS[s.color] || s.color;\n            const bars = cfg.series.filter(s => s.type==='bar'), lines = cfg.series.filter(s => s.type==='line');\n            const nice = m => { if(m<=0) return 1; const e=Math.pow(10,Math.floor(Math.log10(m))); const f=m/e; return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*e; };\n            const W=1000,H=330,pL=64,pR=56,pT=16,pB=40, iw=W-pL-pR, ih=H-pT-pB;\n            const maxL = nice(Math.max(1,...rows.flatMap(r => bars.map(s => r[s.key]||0))));\n            const maxR = nice(Math.max(1,...rows.flatMap(r => lines.map(s => r[s.key]||0))));\n            const cw = iw/Math.max(rows.length,1);\n            const X = i => pL + cw*(i+.5);\n            const YL = v => pT + ih - v/maxL*ih, YR = v => pT + ih - v/maxR*ih;\n            const ticks = 5;\n            let g = '';\n            for (let k=0;k<=ticks;k++) {\n                const y = pT + ih - ih*k/ticks;\n                g += '<line x1=\"'+pL+'\" x2=\"'+(W-pR)+'\" y1=\"'+y+'\" y2=\"'+y+'\" stroke=\"#eef0f3\"/>';\n                g += '<text x=\"'+(pL-10)+'\" y=\"'+(y+4)+'\" text-anchor=\"end\" font-size=\"13\" fill=\"#8b93a1\">'+(bars[0].prefix||'')+Math.round(maxL*k/ticks).toLocaleString()+'<\u002Ftext>';\n                g += '<text x=\"'+(W-pR+10)+'\" y=\"'+(y+4)+'\" font-size=\"13\" fill=\"#8b93a1\">'+Math.round(maxR*k/ticks).toLocaleString()+'<\u002Ftext>';\n            }\n            const step = Math.ceil(rows.length/10);\n            rows.forEach((r,i) => {\n                g += '<line x1=\"'+X(i)+'\" x2=\"'+X(i)+'\" y1=\"'+pT+'\" y2=\"'+(pT+ih)+'\" stroke=\"#f3f4f6\"/>';\n                if (i%step===0) g += '<text x=\"'+X(i)+'\" y=\"'+(H-14)+'\" text-anchor=\"middle\" font-size=\"13\" fill=\"#8b93a1\">'+lab(r.date)+'<\u002Ftext>';\n            });\n            const gw = Math.min(cw*.7, 56*bars.length), bw = gw/bars.length;\n            bars.forEach((s,bi) => rows.forEach((r,i) => {\n                const x = X(i)-gw/2+bi*bw, y = YL(r[s.key]||0), h = pT+ih-y, rad = Math.min(5,bw/2,h);\n                g += '<path d=\"M'+x+','+(pT+ih)+'V'+(y+rad)+'Q'+x+','+y+' '+(x+rad)+','+y+'H'+(x+bw-1-rad)+'Q'+(x+bw-1)+','+y+' '+(x+bw-1)+','+(y+rad)+'V'+(pT+ih)+'Z\" fill=\"'+colOf(s)+'\"/>';\n            }));\n            const smooth = pts => { if(pts.length<2) return ''; let d='M'+pts[0][0]+','+pts[0][1]; for(let i=0;i<pts.length-1;i++){const p0=pts[i-1]||pts[i],p1=pts[i],p2=pts[i+1],p3=pts[i+2]||p2; d+='C'+(p1[0]+(p2[0]-p0[0])/6)+','+(p1[1]+(p2[1]-p0[1])/6)+' '+(p2[0]-(p3[0]-p1[0])/6)+','+(p2[1]-(p3[1]-p1[1])/6)+' '+p2[0]+','+p2[1];} return d; };\n            lines.forEach(s => {\n                const pts = rows.map((r,i)=>[X(i),YR(r[s.key]||0)]);\n                g += '<path d=\"'+smooth(pts)+'\" fill=\"none\" stroke=\"'+colOf(s)+'\" stroke-width=\"3.5\" stroke-linecap=\"round\"/>';\n                if (rows.length<=16) pts.forEach(q => g += '<circle cx=\"'+q[0]+'\" cy=\"'+q[1]+'\" r=\"4.5\" fill=\"#fff\" stroke=\"'+colOf(s)+'\" stroke-width=\"2.5\"/>');\n            });\n            g += '<line id=\"atc-x\" x1=\"0\" x2=\"0\" y1=\"'+pT+'\" y2=\"'+(pT+ih)+'\" stroke=\"#9ca3af\" stroke-dasharray=\"4 4\" style=\"display:none\"/>';\n            const hits = rows.map((r,i) => '<rect data-i=\"'+i+'\" x=\"'+(pL+cw*i)+'\" y=\"'+pT+'\" width=\"'+cw+'\" height=\"'+ih+'\" fill=\"transparent\"/>').join('');\n            const legend = cfg.series.map(s => '<span style=\"display:inline-flex;align-items:center;gap:8px;font-size:13.5px;color:#4b5563;font-weight:500\"><i style=\"width:10px;height:10px;border-radius:50%;background:'+colOf(s)+'\"><\u002Fi>'+s.label+'<\u002Fspan>').join('');\n            const rangeBtns = cfg.timeRanges.map(r => '<button data-range=\"'+r+'\" style=\"height:32px;padding:0 16px;border-radius:999px;border:0;font-size:13px;font-weight:600;cursor:pointer;'+(r===st.range?'background:#2F7FE0;color:#fff':'background:transparent;color:#4b5563')+'\">'+r+'<\u002Fbutton>').join('');\n            const chartIc = '<svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#111\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 3v18h18\"/><path d=\"M7 15l4-4 3 3 5-6\"/><\u002Fsvg>';\n            const tableIc = '<svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#111\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"2\"/><path d=\"M3 9h18M3 15h18M9 3v18\"/><\u002Fsvg>';\n            const body = st.view==='chart'\n                ? '<div style=\"position:relative\"><svg id=\"atc-svg\" viewBox=\"0 0 '+W+' '+H+'\" style=\"width:100%;height:auto;display:block\">'+g+hits+'<\u002Fsvg><div id=\"atc-tip\" style=\"display:none;position:absolute;pointer-events:none;background:#fff;border-radius:10px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:10px 12px;font-size:13px;min-width:170px;z-index:5\"><\u002Fdiv><\u002Fdiv><div style=\"display:flex;justify-content:center;gap:28px;flex-wrap:wrap;margin-top:6px\">'+legend+'<\u002Fdiv>'\n                : '<div style=\"border:1px solid #e5e7eb;border-radius:12px;max-height:340px;overflow:auto\"><table style=\"width:100%;border-collapse:collapse;font-size:14.5px\"><thead><tr>'+['Date'].concat(cfg.series.map(s=>s.label)).map(h=>'<th style=\"position:sticky;top:0;background:#f8f9fb;padding:11px 14px;font-weight:700;font-size:13.5px;color:#111;text-align:center;border-bottom:1px solid #e5e7eb;text-transform:uppercase;letter-spacing:.03em\">'+h+'<\u002Fth>').join('')+'<\u002Ftr><\u002Fthead><tbody>'+rows.slice().reverse().map(r=>'<tr><td style=\"padding:10px 14px;text-align:center;border-bottom:1px solid #f0f1f3;color:#111\">'+lab(r.date)+'<\u002Ftd>'+cfg.series.map(s=>'<td style=\"padding:10px 14px;text-align:center;border-bottom:1px solid #f0f1f3;color:#111;font-variant-numeric:tabular-nums\">'+fmt(s,r[s.key]||0)+'<\u002Ftd>').join('')+'<\u002Ftr>').join('')+'<\u002Ftbody><\u002Ftable><\u002Fdiv>';\n            el.innerHTML = '<div style=\"height:100%;box-sizing:border-box;background:#fff;border:1px solid #eceef2;border-radius:20px;box-shadow:0 1px 4px rgba(0,0,0,.05);padding:16px;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif\">'\n              + '<div style=\"display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px\"><div style=\"display:flex;align-items:center;gap:12px;flex:1 1 auto;min-width:0\"><span style=\"width:42px;height:42px;border-radius:13px;background:#f3f4f6;display:flex;align-items:center;justify-content:center\">'+chartIc+'<\u002Fspan><h3 style=\"font-size:15px;font-weight:700;color:#111827;margin:0\">'+cfg.title+'<\u002Fh3><\u002Fdiv>'\n              + '<div style=\"display:flex;align-items:center;gap:10px;margin-left:auto\"><div style=\"display:flex;gap:2px;padding:3px;background:#f1f2f4;border-radius:999px\">'+rangeBtns+'<\u002Fdiv><button data-toggle style=\"width:42px;height:42px;border-radius:12px;border:1.5px solid #374151;background:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer\" aria-label=\"Toggle chart/table\">'+(st.view==='chart'?tableIc:chartIc)+'<\u002Fbutton><\u002Fdiv><\u002Fdiv>'+body+'<\u002Fdiv>';\n            el.querySelectorAll('[data-range]').forEach(b => b.onclick = () => { st.range = b.dataset.range; AnalyticsTrendCard(el,cfg); });\n            el.querySelector('[data-toggle]').onclick = () => { st.view = st.view==='chart'?'table':'chart'; AnalyticsTrendCard(el,cfg); };\n            const svg = el.querySelector('#atc-svg'); if (!svg) return;\n            const tip = el.querySelector('#atc-tip'), xl = el.querySelector('#atc-x');\n            svg.addEventListener('mouseover', e => {\n                const i = e.target.dataset && e.target.dataset.i; if (i==null) return;\n                const r = rows[+i];\n                xl.setAttribute('x1',X(+i)); xl.setAttribute('x2',X(+i)); xl.style.display='';\n                tip.innerHTML = '<div style=\"font-weight:700;color:#111;margin-bottom:6px\">'+lab(r.date)+'<\u002Fdiv>'+cfg.series.map(s=>'<div style=\"display:flex;align-items:center;justify-content:space-between;gap:14px;margin-top:3px\"><span style=\"display:flex;align-items:center;gap:7px;color:#4b5563\"><i style=\"width:9px;height:9px;border-radius:50%;background:'+colOf(s)+'\"><\u002Fi>'+s.label+'<\u002Fspan><b style=\"color:#111\">'+fmt(s,r[s.key]||0)+'<\u002Fb><\u002Fdiv>').join('');\n                tip.style.display='block';\n                const pct = X(+i)/W*100;\n                tip.style.left = pct>60 ? 'calc('+pct+'% - 190px)' : 'calc('+pct+'% + 14px)'; tip.style.top='20px';\n            });\n            svg.addEventListener('mouseleave', () => { tip.style.display='none'; xl.style.display='none'; });\n        }\n\n        function renderCampaignTrend(daily) {\n            const el = document.getElementById('cd-trend-card'); if (!el) return;\n            const data = daily.map((d,i) => ({ date: d.date, campaignSales: d.sales, netSales: Math.round(d.sales * (2.3 + ((i*7)%5)*0.15)), transactions: d.transactions }));\n            AnalyticsTrendCard(el, {\n                title: 'Campaign Sales vs Net Sales & Transactions',\n                timeRanges: ['7D','14D','1M'], activeRange: '7D',\n                series: [\n                    { key:'campaignSales', label:'Campaign Sales $', type:'bar', color:'primary', prefix:'$' },\n                    { key:'netSales', label:'Net Sales $', type:'bar', color:'primary2', prefix:'$' },\n                    { key:'transactions', label:'Transactions #', type:'line', color:'secondary' }\n                ],\n                data\n            });\n        }\n\n        function renderCampaignTrend2(daily) {\n            const el = document.getElementById('cd-trend-card-2'); if (!el) return;\n            const data = daily.map(d => ({ date: d.date, sales: d.sales, discount: d.redemptions, redemptions: d.redCount }));\n            AnalyticsTrendCard(el, {\n                title: 'Sales vs Discount & Redemptions',\n                timeRanges: ['7D','14D','1M'], activeRange: '7D',\n                series: [\n                    { key:'sales', label:'Sales $', type:'bar', color:'primary', prefix:'$' },\n                    { key:'discount', label:'Discount $', type:'bar', color:'primary2', prefix:'$' },\n                    { key:'redemptions', label:'Redemptions #', type:'line', color:'secondary' }\n                ],\n                data\n            });\n        }\n\n        let loyaltyView = 'chart'; // 'chart' | 'table'\n\n        function renderAllCampaignCharts(daily) {\n            renderCampaignTrend(daily);\n            renderCampaignTrend2(daily);\n            renderCombo('cd-perf', daily);\n            renderLoyaltyCombo(daily);\n            renderLoyaltyTable(daily);\n            renderCombo('cd-visits', daily);\n        }\n\n        // Round up to a \"nice\" axis maximum (1, 2, 2.5, 5 × 10^n)\n        function niceCeil(v) {\n            if (v <= 0) return 1;\n            const exp = Math.floor(Math.log10(v));\n            const base = Math.pow(10, exp);\n            const frac = v / base;\n            let nice;\n            if (frac <= 1) nice = 1;\n            else if (frac <= 2) nice = 2;\n            else if (frac <= 2.5) nice = 2.5;\n            else if (frac <= 5) nice = 5;\n            else nice = 10;\n            return nice * base;\n        }\n\n        // === Loyalty Sales & Transactions — bars ($) + line (#), dual axis ===\n        function renderLoyaltyCombo(dailyData) {\n            const container = document.getElementById('cd-lst-chart');\n            if (!dailyData.length) { container.innerHTML = '<p class=\"text-gray-400 text-sm text-center pt-24\">No data in selected range<\u002Fp>'; return; }\n            const n = dailyData.length;\n\n            const W = 780, H = 300, pL = 66, pR = 58, pT = 24, pB = 52;\n            const cW = W - pL - pR, cH = H - pT - pB;\n\n            const maxSales = niceCeil(Math.max(...dailyData.map(d => d.sales)) * 1.35);\n            const maxTrans = niceCeil(Math.max(...dailyData.map(d => d.transactions)) * 1.35);\n\n            let svg = '<svg viewBox=\"0 0 '+W+' '+H+'\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;height:100%;\" preserveAspectRatio=\"xMidYMid meet\" font-family=\"Inter,sans-serif\">';\n\n            // Horizontal dashed grid + dual axis labels (4 intervals / 5 labels)\n            for (let i = 0; i <= 4; i++) {\n                const y = pT + cH * (1 - i/4);\n                const sVal = '$' + Math.round(maxSales * i / 4).toLocaleString();\n                const tVal = Math.round(maxTrans * i / 4).toLocaleString();\n                svg += '<line x1=\"'+pL+'\" y1=\"'+y+'\" x2=\"'+(W-pR)+'\" y2=\"'+y+'\" stroke=\"#e5e7eb\" stroke-dasharray=\"4,4\"/>';\n                svg += '<text x=\"'+(pL-12)+'\" y=\"'+(y+4)+'\" text-anchor=\"end\" fill=\"#4f46e5\" font-size=\"12\" font-weight=\"700\">'+sVal+'<\u002Ftext>';\n                svg += '<text x=\"'+(W-pR+12)+'\" y=\"'+(y+4)+'\" text-anchor=\"start\" fill=\"#232e7c\" font-size=\"12\" font-weight=\"700\">'+tVal+'<\u002Ftext>';\n            }\n\n            // Baseline\n            svg += '<line x1=\"'+pL+'\" y1=\"'+(pT+cH)+'\" x2=\"'+(W-pR)+'\" y2=\"'+(pT+cH)+'\" stroke=\"#d1d5db\" stroke-width=\"1\"/>';\n\n            const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];\n            const slotW = cW / n;\n            const barW = Math.min(34, slotW * 0.5);\n            const labelEvery = Math.max(1, Math.ceil(n / 10));\n\n            // Bars (Loyalty Sales $)\n            dailyData.forEach(function(d, i) {\n                const cx = pL + slotW * (i + 0.5);\n                const barH = (d.sales / maxSales) * cH;\n                const y = pT + cH - barH;\n                svg += '<rect x=\"'+(cx - barW/2).toFixed(1)+'\" y=\"'+y.toFixed(1)+'\" width=\"'+barW.toFixed(1)+'\" height=\"'+barH.toFixed(1)+'\" rx=\"5\" fill=\"#c7d2fe\"/>';\n            });\n\n            // Line (Loyalty Transactions #)\n            let linePath = dailyData.map(function(d, i) {\n                const cx = pL + slotW * (i + 0.5);\n                const y = pT + cH * (1 - d.transactions / maxTrans);\n                return (i===0?'M':'L')+cx.toFixed(1)+','+y.toFixed(1);\n            }).join(' ');\n            svg += '<path d=\"'+linePath+'\" fill=\"none\" stroke=\"#232e7c\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>';\n\n            // Dots on the line\n            dailyData.forEach(function(d, i) {\n                const cx = pL + slotW * (i + 0.5);\n                const y = pT + cH * (1 - d.transactions / maxTrans);\n                svg += '<circle cx=\"'+cx.toFixed(1)+'\" cy=\"'+y.toFixed(1)+'\" r=\"5\" fill=\"#232e7c\"/>';\n            });\n\n            // X-axis labels (two-line: month / day)\n            dailyData.forEach(function(d, i) {\n                if (i % labelEvery === 0 || i === n-1) {\n                    const cx = pL + slotW * (i + 0.5);\n                    svg += '<text x=\"'+cx.toFixed(1)+'\" y=\"'+(H-pB+20)+'\" text-anchor=\"middle\" fill=\"#4b5563\" font-size=\"12\" font-weight=\"600\">'+months[d.date.getMonth()]+'<\u002Ftext>';\n                    svg += '<text x=\"'+cx.toFixed(1)+'\" y=\"'+(H-pB+36)+'\" text-anchor=\"middle\" fill=\"#4b5563\" font-size=\"12\" font-weight=\"600\">'+String(d.date.getDate()).padStart(2,'0')+'<\u002Ftext>';\n                }\n            });\n\n            svg += '<\u002Fsvg>';\n            container.innerHTML = svg;\n        }\n\n        // === Loyalty table view ===\n        function renderLoyaltyTable(dailyData) {\n            const tbody = document.getElementById('cd-lst-table-body');\n            if (!tbody) return;\n            const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];\n            if (!dailyData.length) {\n                tbody.innerHTML = '<tr><td colspan=\"3\" class=\"py-8 text-center text-gray-400 text-sm\">No data in selected range<\u002Ftd><\u002Ftr>';\n                return;\n            }\n            tbody.innerHTML = dailyData.map(function(d, i) {\n                const dateLabel = months[d.date.getMonth()] + ' ' + String(d.date.getDate()).padStart(2,'0');\n                const rowBg = (i % 2 === 1) ? 'background:#fafbfc;' : '';\n                return '<tr style=\"border-bottom:1px solid #f1f5f9;'+rowBg+'\">'\n                    + '<td class=\"py-3.5 px-4 font-bold\" style=\"color:#64748b;\">'+dateLabel+'<\u002Ftd>'\n                    + '<td class=\"py-3.5 px-4 text-center font-bold\" style=\"color:#4f46e5;\">$'+d.sales.toLocaleString()+'<\u002Ftd>'\n                    + '<td class=\"py-3.5 px-4 text-right font-bold\" style=\"color:#1e293b;\">'+d.transactions.toLocaleString()+'<\u002Ftd>'\n                    + '<\u002Ftr>';\n            }).join('');\n        }\n\n        // === Toggle between chart and table view ===\n        function toggleLoyaltyView() {\n            loyaltyView = (loyaltyView === 'chart') ? 'table' : 'chart';\n            const chartWrap = document.getElementById('cd-lst-chart-wrap');\n            const tableWrap = document.getElementById('cd-lst-table-wrap');\n            const icon = document.getElementById('cd-lst-toggle-icon');\n            if (loyaltyView === 'table') {\n                chartWrap.classList.add('hidden');\n                tableWrap.classList.remove('hidden');\n                // Switch icon to a \"chart/bars\" glyph to indicate you can go back\n                icon.innerHTML = '<line x1=\"2\" y1=\"16\" x2=\"2\" y2=\"10\" stroke=\"#6b7280\" stroke-width=\"1.8\" stroke-linecap=\"round\"/><line x1=\"7\" y1=\"16\" x2=\"7\" y2=\"4\" stroke=\"#6b7280\" stroke-width=\"1.8\" stroke-linecap=\"round\"/><line x1=\"12\" y1=\"16\" x2=\"12\" y2=\"8\" stroke=\"#6b7280\" stroke-width=\"1.8\" stroke-linecap=\"round\"/><line x1=\"17\" y1=\"16\" x2=\"17\" y2=\"2\" stroke=\"#6b7280\" stroke-width=\"1.8\" stroke-linecap=\"round\"/>';\n            } else {\n                tableWrap.classList.add('hidden');\n                chartWrap.classList.remove('hidden');\n                // Restore grid glyph\n                icon.innerHTML = '<rect x=\"1\" y=\"1\" width=\"7\" height=\"7\" rx=\"1.5\" stroke=\"#6b7280\" stroke-width=\"1.5\" fill=\"none\"/><rect x=\"10\" y=\"1\" width=\"7\" height=\"7\" rx=\"1.5\" stroke=\"#6b7280\" stroke-width=\"1.5\" fill=\"none\"/><rect x=\"1\" y=\"10\" width=\"7\" height=\"7\" rx=\"1.5\" stroke=\"#6b7280\" stroke-width=\"1.5\" fill=\"none\"/><rect x=\"10\" y=\"10\" width=\"7\" height=\"7\" rx=\"1.5\" stroke=\"#6b7280\" stroke-width=\"1.5\" fill=\"none\"/>';\n            }\n        }\n\n        function closeCampaignDetail() {\n            document.getElementById('campaign-detail').classList.add('hidden');\n            document.getElementById('dashboard-home').classList.remove('hidden');\n            activeCampaignId = null;\n            activeDailyData = [];\n        }\n\n        // === Delivery Analytics Bar Chart ===\n        function renderDeliveryChart(data) {\n            const container = document.getElementById('cd-delivery-chart');\n            const cats = Object.keys(data);\n            const vals = Object.values(data);\n            const maxV = Math.max(...vals) * 1.18 || 1;\n            const W = 820, H = 280, pL = 55, pR = 20, pT = 28, pB = 52;\n            const cW = W - pL - pR, cH = H - pT - pB;\n            const barColors = ['#14b8a6','#5eead4','#99f6e4','#fca5a5','#2dd4bf','#fbbf24','#0d9488','#fb923c'];\n            let svg = '<svg viewBox=\"0 0 '+W+' '+H+'\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;height:100%;\" preserveAspectRatio=\"xMidYMid meet\">';\n            const steps = 5;\n            for (let i = 0; i <= steps; i++) {\n                const y = pT + cH * (1 - i/steps);\n                const v = Math.round(maxV * i / steps);\n                svg += '<line x1=\"'+pL+'\" y1=\"'+y+'\" x2=\"'+(W-pR)+'\" y2=\"'+y+'\" stroke=\"#e5e7eb\" stroke-dasharray=\"4,3\"/>';\n                svg += '<text x=\"'+(pL-8)+'\" y=\"'+(y+4)+'\" text-anchor=\"end\" fill=\"#9ca3af\" font-size=\"11\" font-family=\"Inter,sans-serif\">'+v+'<\u002Ftext>';\n            }\n            const gap = cW / cats.length;\n            const barW = gap * 0.55;\n            cats.forEach(function(cat, i) {\n                const x = pL + i * gap + (gap - barW) / 2;\n                const barH = (vals[i] / maxV) * cH;\n                const y = pT + cH - barH;\n                svg += '<rect class=\"cd-chart-bar\" x=\"'+x+'\" y=\"'+y+'\" width=\"'+barW+'\" height=\"'+barH+'\" rx=\"4\" fill=\"'+barColors[i % barColors.length]+'\"/>';\n                if (vals[i] > 0) svg += '<text x=\"'+(x+barW/2)+'\" y=\"'+(y-7)+'\" text-anchor=\"middle\" fill=\"#374151\" font-size=\"11\" font-weight=\"600\" font-family=\"Inter,sans-serif\">'+vals[i].toLocaleString()+'<\u002Ftext>';\n                svg += '<text x=\"'+(x+barW/2)+'\" y=\"'+(H-pB+18)+'\" text-anchor=\"middle\" fill=\"#6b7280\" font-size=\"10.5\" font-family=\"Inter,sans-serif\">'+cat+'<\u002Ftext>';\n            });\n            svg += '<\u002Fsvg>';\n            container.innerHTML = svg;\n        }\n\n        // === Campaign Performance (dual-axis: Redemptions left, Revenue right) ===\n        function renderPerfChart(dailyData) {\n            const container = document.getElementById('cd-perf-chart');\n            if (!dailyData.length) { container.innerHTML = '<p class=\"text-gray-400 text-sm text-center pt-20\">No data in selected range<\u002Fp>'; return; }\n            const W = 900, H = 280, pL = 60, pR = 65, pT = 18, pB = 48;\n            const cW = W - pL - pR, cH = H - pT - pB;\n            const n = dailyData.length;\n\n            const maxRed = Math.max(...dailyData.map(d => d.redemptions)) * 1.25 || 1;\n            const maxRev = Math.max(...dailyData.map(d => d.sales)) * 1.25 || 1;\n\n            let svg = '<svg viewBox=\"0 0 '+W+' '+H+'\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;height:100%;\" preserveAspectRatio=\"xMidYMid meet\">';\n\n            // Grid\n            for (let i = 0; i <= 4; i++) {\n                const y = pT + cH * (1 - i/4);\n                const rv = Math.round(maxRed * i / 4);\n                const sv = '$' + Math.round(maxRev * i / 4).toLocaleString();\n                svg += '<line x1=\"'+pL+'\" y1=\"'+y+'\" x2=\"'+(W-pR)+'\" y2=\"'+y+'\" stroke=\"#f3f4f6\" stroke-dasharray=\"4,3\"/>';\n                svg += '<text x=\"'+(pL-10)+'\" y=\"'+(y+4)+'\" text-anchor=\"end\" fill=\"#6366f1\" font-size=\"10\" font-family=\"Inter,sans-serif\">'+rv+'<\u002Ftext>';\n                svg += '<text x=\"'+(W-pR+10)+'\" y=\"'+(y+4)+'\" text-anchor=\"start\" fill=\"#22c55e\" font-size=\"10\" font-family=\"Inter,sans-serif\">'+sv+'<\u002Ftext>';\n            }\n            // Y-axis labels\n            svg += '<text x=\"'+(pL-10)+'\" y=\"'+(pT-6)+'\" text-anchor=\"end\" fill=\"#6366f1\" font-size=\"10\" font-weight=\"600\" font-family=\"Inter,sans-serif\">Redemptions<\u002Ftext>';\n            svg += '<text x=\"'+(W-pR+10)+'\" y=\"'+(pT-6)+'\" text-anchor=\"start\" fill=\"#22c55e\" font-size=\"10\" font-weight=\"600\" font-family=\"Inter,sans-serif\">Revenue<\u002Ftext>';\n\n            // X-axis\n            const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];\n            const labelEvery = Math.max(1, Math.ceil(n / 12));\n            dailyData.forEach(function(d, i) {\n                if (i % labelEvery === 0 || i === n-1) {\n                    const x = pL + (i / (n-1||1)) * cW;\n                    svg += '<text x=\"'+x+'\" y=\"'+(H-pB+20)+'\" text-anchor=\"middle\" fill=\"#9ca3af\" font-size=\"10\" font-family=\"Inter,sans-serif\">'+months[d.date.getMonth()]+' '+String(d.date.getDate()).padStart(2,'0')+'<\u002Ftext>';\n                }\n            });\n\n            // Revenue area fill + line (green, primary — behind)\n            let revPath = dailyData.map(function(d, i) {\n                const x = pL + (i / (n-1||1)) * cW;\n                const y = pT + cH * (1 - d.sales / maxRev);\n                return (i===0?'M':'L')+x.toFixed(1)+','+y.toFixed(1);\n            }).join(' ');\n            let revAreaPath = revPath + ' L'+(pL+cW).toFixed(1)+','+(pT+cH).toFixed(1)+' L'+pL.toFixed(1)+','+(pT+cH).toFixed(1)+' Z';\n            svg += '<path d=\"'+revAreaPath+'\" fill=\"#22c55e\" opacity=\"0.08\"/>';\n            svg += '<path d=\"'+revPath+'\" fill=\"none\" stroke=\"#22c55e\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>';\n\n            // Redemption line (indigo, dashed comparison — front)\n            let redPath = dailyData.map(function(d, i) {\n                const x = pL + (i / (n-1||1)) * cW;\n                const y = pT + cH * (1 - d.redemptions / maxRed);\n                return (i===0?'M':'L')+x.toFixed(1)+','+y.toFixed(1);\n            }).join(' ');\n            svg += '<path d=\"'+redPath+'\" fill=\"none\" stroke=\"#6366f1\" stroke-width=\"2.5\" stroke-dasharray=\"6,3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>';\n\n            // Dots\n            dailyData.forEach(function(d, i) {\n                if (i % labelEvery === 0 || i === n-1) {\n                    const x = pL + (i / (n-1||1)) * cW;\n                    const yRed = pT + cH * (1 - d.redemptions / maxRed);\n                    const yRev = pT + cH * (1 - d.sales / maxRev);\n                    svg += '<circle cx=\"'+x.toFixed(1)+'\" cy=\"'+yRev.toFixed(1)+'\" r=\"3.5\" fill=\"#22c55e\" stroke=\"white\" stroke-width=\"2\"/>';\n                    svg += '<circle cx=\"'+x.toFixed(1)+'\" cy=\"'+yRed.toFixed(1)+'\" r=\"3.5\" fill=\"#6366f1\" stroke=\"white\" stroke-width=\"2\"/>';\n                }\n            });\n\n            svg += '<\u002Fsvg>';\n            container.innerHTML = svg;\n        }\n\n        // === Visits Line Chart ===\n        function renderVisitsChart(daily) {\n            const container = document.getElementById('cd-visits-chart');\n            if (!daily.length) { container.innerHTML = '<p class=\"text-gray-400 text-sm text-center pt-20\">No data in selected range<\u002Fp>'; return; }\n            const W = 900, H = 240, pL = 50, pR = 15, pT = 15, pB = 45;\n            const cW = W - pL - pR, cH = H - pT - pB;\n            const n = daily.length;\n            const maxV = Math.max(...daily.flatMap(d => [d.unique, d.repeat])) * 1.25 || 1;\n\n            let svg = '<svg viewBox=\"0 0 '+W+' '+H+'\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;height:100%;\" preserveAspectRatio=\"xMidYMid meet\">';\n            for (let i = 0; i <= 4; i++) {\n                const y = pT + cH * (1 - i/4);\n                svg += '<line x1=\"'+pL+'\" y1=\"'+y+'\" x2=\"'+(W-pR)+'\" y2=\"'+y+'\" stroke=\"#e5e7eb\" stroke-dasharray=\"4,3\"/>';\n                svg += '<text x=\"'+(pL-8)+'\" y=\"'+(y+4)+'\" text-anchor=\"end\" fill=\"#9ca3af\" font-size=\"10\" font-family=\"Inter,sans-serif\">'+Math.round(maxV*i/4)+'<\u002Ftext>';\n            }\n            const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];\n            const labelEvery = Math.max(1, Math.ceil(n / 12));\n            daily.forEach(function(d, i) {\n                if (i % labelEvery === 0 || i === n-1) {\n                    const x = pL + (i / (n-1||1)) * cW;\n                    svg += '<text x=\"'+x+'\" y=\"'+(H-pB+18)+'\" text-anchor=\"middle\" fill=\"#9ca3af\" font-size=\"10\" font-family=\"Inter,sans-serif\">'+months[d.date.getMonth()]+' '+String(d.date.getDate()).padStart(2,'0')+'<\u002Ftext>';\n                }\n            });\n            function buildPath(key) {\n                return daily.map(function(d, i) {\n                    const x = pL + (i / (n-1||1)) * cW;\n                    const y = pT + cH * (1 - d[key] / maxV);\n                    return (i===0?'M':'L')+x.toFixed(1)+','+y.toFixed(1);\n                }).join(' ');\n            }\n            let uniquePath = buildPath('unique');\n            let uniqueAreaPath = uniquePath + ' L'+(pL+cW).toFixed(1)+','+(pT+cH).toFixed(1)+' L'+pL.toFixed(1)+','+(pT+cH).toFixed(1)+' Z';\n            svg += '<path d=\"'+uniqueAreaPath+'\" fill=\"#14b8a6\" opacity=\"0.08\"/>';\n            svg += '<path d=\"'+uniquePath+'\" fill=\"none\" stroke=\"#14b8a6\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>';\n            svg += '<path d=\"'+buildPath('repeat')+'\" fill=\"none\" stroke=\"#f97316\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-dasharray=\"6,3\"/>';\n            daily.forEach(function(d, i) {\n                if (i % labelEvery === 0 || i === n-1) {\n                    const x = pL + (i / (n-1||1)) * cW;\n                    const y1 = pT + cH * (1 - d.unique / maxV);\n                    const y2 = pT + cH * (1 - d.repeat / maxV);\n                    svg += '<circle cx=\"'+x.toFixed(1)+'\" cy=\"'+y1.toFixed(1)+'\" r=\"3\" fill=\"#14b8a6\" stroke=\"white\" stroke-width=\"1.5\"/>';\n                    svg += '<circle cx=\"'+x.toFixed(1)+'\" cy=\"'+y2.toFixed(1)+'\" r=\"3\" fill=\"#f97316\" stroke=\"white\" stroke-width=\"1.5\"/>';\n                }\n            });\n            svg += '<\u002Fsvg>';\n            container.innerHTML = svg;\n        }\n\n\n        // ============================================================\n        // Offer Detail Screen — data, charts, navigation\n        // ============================================================\n        const offerDetailData = {\n            'OFR-501': { type: 'BOGO', value: 'Buy 1 Get 1 Free', minSpend: 0, perCustomer: 2, appliesTo: 'Burgers',\n                incRevenue: 4680, incRevenueChg: 24.5, avgCheckChg: 8.2, roiChg: 1.1,\n                uniqueRedeemers: 298, newMembers: 46, existingMembers: 252, firstTimeBuyers: 38, repeatCustomers: 214 },\n            'OFR-502': { type: 'Free Item', value: 'Free Side', minSpend: 8, perCustomer: 1, appliesTo: 'Sides',\n                incRevenue: 1470, incRevenueChg: 16.8, avgCheckChg: 5.4, roiChg: 0.6,\n                uniqueRedeemers: 104, newMembers: 22, existingMembers: 82, firstTimeBuyers: 15, repeatCustomers: 70 },\n            'OFR-503': { type: '% Off', value: '20% off', minSpend: 0, perCustomer: 3, appliesTo: 'Entrees',\n                incRevenue: 2675, incRevenueChg: 21.2, avgCheckChg: 7.1, roiChg: 0.9,\n                uniqueRedeemers: 176, newMembers: 31, existingMembers: 145, firstTimeBuyers: 24, repeatCustomers: 121 },\n            'OFR-504': { type: '$ Off', value: '$5 off', minSpend: 25, perCustomer: 2, appliesTo: 'Any order',\n                incRevenue: 4110, incRevenueChg: 26.4, avgCheckChg: 9.0, roiChg: 1.4,\n                uniqueRedeemers: 251, newMembers: 48, existingMembers: 203, firstTimeBuyers: 40, repeatCustomers: 168 },\n            'OFR-505': { type: 'BOGO', value: 'Buy 1 Get 1 Free', minSpend: 0, perCustomer: 2, appliesTo: 'Appetizers',\n                incRevenue: 2280, incRevenueChg: 19.5, avgCheckChg: 6.6, roiChg: 0.8,\n                uniqueRedeemers: 149, newMembers: 27, existingMembers: 122, firstTimeBuyers: 20, repeatCustomers: 101 },\n            'OFR-506': { type: 'Free Item', value: 'Free Dessert', minSpend: 15, perCustomer: 1, appliesTo: 'Desserts',\n                incRevenue: 1465, incRevenueChg: 30.1, avgCheckChg: 10.2, roiChg: 1.8,\n                uniqueRedeemers: 72, newMembers: 14, existingMembers: 58, firstTimeBuyers: 10, repeatCustomers: 48 },\n            'OFR-507': { type: 'Credit', value: '$10 credit', minSpend: 30, perCustomer: 1, appliesTo: 'Any order',\n                incRevenue: 3315, incRevenueChg: 15.2, avgCheckChg: 4.8, roiChg: 0.5,\n                uniqueRedeemers: 205, newMembers: 52, existingMembers: 153, firstTimeBuyers: 44, repeatCustomers: 120 },\n            'OFR-508': { type: '% Off', value: '15% off', minSpend: 0, perCustomer: 3, appliesTo: 'Lunch menu',\n                incRevenue: 2835, incRevenueChg: 22.7, avgCheckChg: 7.9, roiChg: 1.0,\n                uniqueRedeemers: 182, newMembers: 34, existingMembers: 148, firstTimeBuyers: 26, repeatCustomers: 122 }\n        };\n\n        function computeOfferStatus(fromStr, toStr) {\n            const today = new Date();\n            const from = parseDateMDY(fromStr), to = parseDateMDY(toStr);\n            if (today < from) return 'Scheduled';\n            if (today > to) return 'Expired';\n            return 'Active';\n        }\n\n        // Daily series for an offer (seeded, aligned to offer totals)\n        function generateOfferDailyData(fromStr, toStr, offer) {\n            const from = parseDateMDY(fromStr), to = parseDateMDY(toStr);\n            const days = []; let d = new Date(from);\n            while (d <= to) { days.push(new Date(d)); d.setDate(d.getDate() + 1); }\n            const rng = seedRandom(hashStr(offer.id));\n            const salesOfferBase = offer.salesOffer / days.length;\n            const redCountBase = offer.redemptionCount / days.length;\n            const discountBase = offer.redemptionAmount / days.length;\n            const transBase = offer.loyaltyTrans / days.length;\n            return days.map(day => {\n                const dow = day.getDay();\n                const wk = (dow === 0 || dow === 5 || dow === 6) ? 1.3 : 1;\n                return {\n                    date: day,\n                    salesWithOffer: Math.round(salesOfferBase * (0.6 + rng() * 0.8) * wk),\n                    redemptionCount: Math.round(redCountBase * (0.5 + rng() * 1.0) * wk),\n                    discountGiven: Math.round(discountBase * (0.5 + rng() * 1.0) * wk),\n                    unique: Math.round(transBase * (0.4 + rng() * 0.6) * wk * 0.7),\n                    repeat: Math.round(transBase * (0.2 + rng() * 0.5) * wk * 0.4)\n                };\n            });\n        }\n\n        let activeOfferId = null;\n        let activeOfferDaily = [];\n        let offerView = 'chart';\n\n        function openOfferDetail(offerId) {\n            const row = offerRows.find(r => r.id === offerId);\n            const detail = offerDetailData[offerId];\n            if (!row || !detail) return;\n            activeOfferId = offerId;\n\n            // Header\n            document.getElementById('od-breadcrumb').textContent = row.name;\n            document.getElementById('od-name').textContent = row.name;\n            document.getElementById('od-id').textContent = row.id;\n            document.getElementById('od-validity').textContent = row.from + ' \\u2192 ' + row.to;\n            document.getElementById('od-users-targeted').textContent = row.users.toLocaleString() + ' users targeted';\n\n            // Mechanics chips\n            const chips = [\n                { label: 'Type', val: detail.type },\n                { label: 'Offer', val: detail.value },\n                { label: 'Applies to', val: detail.appliesTo }\n            ];\n            document.getElementById('od-mechanics').innerHTML = chips.map(function(ch) {\n                return '<span class=\"inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-gray-50 border border-gray-200 text-[12px]\">'\n                    + '<span class=\"text-gray-400 font-medium\">' + ch.label + '<\u002Fspan>'\n                    + '<span class=\"text-gray-800 font-bold\">' + ch.val + '<\u002Fspan><\u002Fspan>';\n            }).join('');\n\n            // Date range\n            const fromDate = parseDateMDY(row.from), toDate = parseDateMDY(row.to);\n            document.getElementById('od-date-from').value = toISODate(fromDate);\n            document.getElementById('od-date-to').value = toISODate(toDate);\n            document.getElementById('od-daterange-display').textContent = row.from + ' - ' + row.to;\n\n            // Status badge\n            const status = computeOfferStatus(row.from, row.to);\n            const badge = document.getElementById('od-status-badge');\n            const cls = status === 'Active' ? 'cd-status-active' : status === 'Scheduled' ? 'cd-status-scheduled' : 'cd-status-expired';\n            const dot = status === 'Active' ? 'bg-emerald-600' : status === 'Scheduled' ? 'bg-blue-600' : 'bg-red-600';\n            badge.className = 'cd-status ' + cls;\n            badge.innerHTML = '<span class=\"w-1.5 h-1.5 rounded-full ' + dot + '\"><\u002Fspan> ' + status;\n\n            // Redemption KPIs\n            const redRate = (row.redemptionCount / row.users) * 100;\n            const avgDisc = row.redemptionAmount / row.redemptionCount;\n            document.getElementById('od-kpi-redcount').textContent = row.redemptionCount.toLocaleString();\n            document.getElementById('od-kpi-redrate').textContent = redRate.toFixed(1) + '%';\n            document.getElementById('od-kpi-discount').textContent = '$' + row.redemptionAmount.toLocaleString();\n            document.getElementById('od-kpi-avgdisc').textContent = '$' + avgDisc.toFixed(2);\n            document.getElementById('od-kpi-status').textContent = status;\n            // Status card color\n            const acc = document.getElementById('od-kpi-status-accent');\n            const ibg = document.getElementById('od-kpi-status-icon-bg');\n            const isvg = document.getElementById('od-kpi-status-svg');\n            if (status === 'Active')      { acc.style.background = '#22c55e'; ibg.style.background = '#f0fdf4'; isvg.style.stroke = '#16a34a'; }\n            else if (status === 'Scheduled'){ acc.style.background = '#3b82f6'; ibg.style.background = '#eff6ff'; isvg.style.stroke = '#2563eb'; }\n            else                          { acc.style.background = '#9ca3af'; ibg.style.background = '#f3f4f6'; isvg.style.stroke = '#6b7280'; }\n\n            // Offer Economics\n            const avgCheck = row.salesOffer / row.redemptionCount;\n            const discPct = (row.redemptionAmount / row.salesOffer) * 100;\n            const roi = detail.incRevenue / row.redemptionAmount;\n            document.getElementById('od-eco-sales').textContent = '$' + row.salesOffer.toLocaleString();\n            document.getElementById('od-eco-sales-sub').textContent = row.redemptionCount.toLocaleString() + ' redemptions';\n            document.getElementById('od-eco-discount').textContent = '$' + row.redemptionAmount.toLocaleString();\n            document.getElementById('od-eco-discount-sub').textContent = discPct.toFixed(1) + '% of offer sales';\n            document.getElementById('od-eco-avgdisc').textContent = '$' + avgDisc.toFixed(2);\n            document.getElementById('od-eco-loyaltysales').textContent = '$' + row.loyaltySales.toLocaleString();\n            document.getElementById('od-eco-loyaltysales-chg').textContent = row.loyaltyTrans.toLocaleString() + ' loyalty transactions';\n            document.getElementById('od-eco-avgcheck').textContent = '$' + avgCheck.toFixed(2);\n            document.getElementById('od-eco-avgcheck-chg').innerHTML = '\\u2191 ' + detail.avgCheckChg + '%';\n            document.getElementById('od-eco-redemption').textContent = '$' + row.redemptionAmount.toLocaleString();\n            document.getElementById('od-eco-redemption-chg').textContent = row.redemptionCount.toLocaleString() + ' redemptions';\n\n            // Redeemer Insights\n            const uniq = detail.uniqueRedeemers;\n            const avgPer = row.redemptionCount / uniq;\n            document.getElementById('od-aud-targeted').textContent = row.users.toLocaleString();\n            document.getElementById('od-aud-unique').textContent = uniq.toLocaleString();\n            document.getElementById('od-aud-unique-sub').textContent = avgPer.toFixed(2) + ' avg / customer';\n            document.getElementById('od-aud-new').textContent = detail.newMembers.toLocaleString();\n            document.getElementById('od-aud-new-pct').textContent = ((detail.newMembers / uniq) * 100).toFixed(1) + '% of redeemers';\n            document.getElementById('od-aud-existing').textContent = detail.existingMembers.toLocaleString();\n            document.getElementById('od-aud-existing-pct').textContent = ((detail.existingMembers / uniq) * 100).toFixed(1) + '%';\n            document.getElementById('od-aud-firsttime').textContent = detail.firstTimeBuyers.toLocaleString();\n            document.getElementById('od-aud-firsttime-pct').textContent = ((detail.firstTimeBuyers / uniq) * 100).toFixed(1) + '% of redeemers';\n            document.getElementById('od-aud-repeat').textContent = detail.repeatCustomers.toLocaleString();\n            document.getElementById('od-aud-repeat-pct').textContent = ((detail.repeatCustomers / uniq) * 100).toFixed(1) + '% of redeemers';\n\n            // Charts — start in chart view\n            activeOfferDaily = generateOfferDailyData(row.from, row.to, row);\n            offerView = 'chart';\n            document.getElementById('od-lst-chart-wrap').classList.remove('hidden');\n            document.getElementById('od-lst-table-wrap').classList.add('hidden');\n            document.getElementById('od-lst-toggle-icon').innerHTML = '<rect x=\"1\" y=\"1\" width=\"7\" height=\"7\" rx=\"1.5\" stroke=\"#6b7280\" stroke-width=\"1.5\" fill=\"none\"/><rect x=\"10\" y=\"1\" width=\"7\" height=\"7\" rx=\"1.5\" stroke=\"#6b7280\" stroke-width=\"1.5\" fill=\"none\"/><rect x=\"1\" y=\"10\" width=\"7\" height=\"7\" rx=\"1.5\" stroke=\"#6b7280\" stroke-width=\"1.5\" fill=\"none\"/><rect x=\"10\" y=\"10\" width=\"7\" height=\"7\" rx=\"1.5\" stroke=\"#6b7280\" stroke-width=\"1.5\" fill=\"none\"/>';\n            resetComboView('od-perf'); resetComboView('od-visits');\n            renderAllOfferCharts(activeOfferDaily);\n\n            // Show/hide views\n            document.getElementById('dashboard-home').classList.add('hidden');\n            document.getElementById('campaign-detail').classList.add('hidden');\n            document.getElementById('offer-detail').classList.remove('hidden');\n            if (typeof lucide !== 'undefined' && typeof lucide.createIcons === 'function') {\n                try { lucide.createIcons(); } catch(e) { renderIconsFallback(); }\n            } else { renderIconsFallback(); }\n            document.querySelector('#view-dashboard main').scrollTop = 0;\n        }\n\n        function closeOfferDetail() {\n            document.getElementById('offer-detail').classList.add('hidden');\n            document.getElementById('dashboard-home').classList.remove('hidden');\n            activeOfferId = null;\n            activeOfferDaily = [];\n        }\n\n        function applyOfferDateRange() {\n            if (!activeOfferId) return;\n            const fromVal = document.getElementById('od-date-from').value;\n            const toVal = document.getElementById('od-date-to').value;\n            if (!fromVal || !toVal) return;\n            const from = new Date(fromVal), to = new Date(toVal);\n            const filtered = activeOfferDaily.filter(d => d.date >= from && d.date <= to);\n            renderAllOfferCharts(filtered);\n        }\n\n        function renderAllOfferCharts(daily) {\n            renderCombo('od-perf', daily);\n            renderOfferCombo(daily);\n            renderOfferTable(daily);\n            renderCombo('od-visits', daily);\n        }\n\n        // Redemption Performance: Redemptions (#, left, indigo) vs Sales w/ Offer ($, right, green)\n        function renderOfferPerfChart(dailyData) {\n            const container = document.getElementById('od-perf-chart');\n            if (!dailyData.length) { container.innerHTML = '<p class=\"text-gray-400 text-sm text-center pt-20\">No data in selected range<\u002Fp>'; return; }\n            const W = 900, H = 280, pL = 60, pR = 65, pT = 18, pB = 48;\n            const cW = W - pL - pR, cH = H - pT - pB, n = dailyData.length;\n            const maxRed = niceCeil(Math.max(...dailyData.map(d => d.redemptionCount)) * 1.25);\n            const maxRev = niceCeil(Math.max(...dailyData.map(d => d.salesWithOffer)) * 1.25);\n            let svg = '<svg viewBox=\"0 0 '+W+' '+H+'\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;height:100%;\" preserveAspectRatio=\"xMidYMid meet\" font-family=\"Inter,sans-serif\">';\n            for (let i = 0; i <= 4; i++) {\n                const y = pT + cH * (1 - i/4);\n                svg += '<line x1=\"'+pL+'\" y1=\"'+y+'\" x2=\"'+(W-pR)+'\" y2=\"'+y+'\" stroke=\"#f3f4f6\" stroke-dasharray=\"4,3\"/>';\n                svg += '<text x=\"'+(pL-10)+'\" y=\"'+(y+4)+'\" text-anchor=\"end\" fill=\"#6366f1\" font-size=\"10\">'+Math.round(maxRed*i/4)+'<\u002Ftext>';\n                svg += '<text x=\"'+(W-pR+10)+'\" y=\"'+(y+4)+'\" text-anchor=\"start\" fill=\"#22c55e\" font-size=\"10\">$'+Math.round(maxRev*i/4).toLocaleString()+'<\u002Ftext>';\n            }\n            svg += '<text x=\"'+(pL-10)+'\" y=\"'+(pT-6)+'\" text-anchor=\"end\" fill=\"#6366f1\" font-size=\"10\" font-weight=\"600\">Redemptions<\u002Ftext>';\n            svg += '<text x=\"'+(W-pR+10)+'\" y=\"'+(pT-6)+'\" text-anchor=\"start\" fill=\"#22c55e\" font-size=\"10\" font-weight=\"600\">Sales w/ Offer<\u002Ftext>';\n            const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];\n            const labelEvery = Math.max(1, Math.ceil(n / 12));\n            dailyData.forEach(function(d, i) {\n                if (i % labelEvery === 0 || i === n-1) {\n                    const x = pL + (i / (n-1||1)) * cW;\n                    svg += '<text x=\"'+x+'\" y=\"'+(H-pB+20)+'\" text-anchor=\"middle\" fill=\"#9ca3af\" font-size=\"10\">'+months[d.date.getMonth()]+' '+String(d.date.getDate()).padStart(2,'0')+'<\u002Ftext>';\n                }\n            });\n            let revPath = dailyData.map(function(d,i){ const x=pL+(i/(n-1||1))*cW; const y=pT+cH*(1-d.salesWithOffer/maxRev); return (i===0?'M':'L')+x.toFixed(1)+','+y.toFixed(1); }).join(' ');\n            let revAreaPath = revPath + ' L'+(pL+cW).toFixed(1)+','+(pT+cH).toFixed(1)+' L'+pL.toFixed(1)+','+(pT+cH).toFixed(1)+' Z';\n            svg += '<path d=\"'+revAreaPath+'\" fill=\"#22c55e\" opacity=\"0.08\"/>';\n            svg += '<path d=\"'+revPath+'\" fill=\"none\" stroke=\"#22c55e\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>';\n            let redPath = dailyData.map(function(d,i){ const x=pL+(i/(n-1||1))*cW; const y=pT+cH*(1-d.redemptionCount/maxRed); return (i===0?'M':'L')+x.toFixed(1)+','+y.toFixed(1); }).join(' ');\n            svg += '<path d=\"'+redPath+'\" fill=\"none\" stroke=\"#6366f1\" stroke-width=\"2.5\" stroke-dasharray=\"6,3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>';\n            dailyData.forEach(function(d, i) {\n                if (i % labelEvery === 0 || i === n-1) {\n                    const x = pL + (i / (n-1||1)) * cW;\n                    svg += '<circle cx=\"'+x.toFixed(1)+'\" cy=\"'+(pT+cH*(1-d.salesWithOffer/maxRev)).toFixed(1)+'\" r=\"3.5\" fill=\"#22c55e\" stroke=\"white\" stroke-width=\"2\"/>';\n                    svg += '<circle cx=\"'+x.toFixed(1)+'\" cy=\"'+(pT+cH*(1-d.redemptionCount/maxRed)).toFixed(1)+'\" r=\"3.5\" fill=\"#6366f1\" stroke=\"white\" stroke-width=\"2\"/>';\n                }\n            });\n            svg += '<\u002Fsvg>';\n            container.innerHTML = svg;\n        }\n\n        // Offer combo: bars = Sales with Offer ($), line = Redemptions (#)\n        function renderOfferCombo(dailyData) {\n            const container = document.getElementById('od-lst-chart');\n            if (!dailyData.length) { container.innerHTML = '<p class=\"text-gray-400 text-sm text-center pt-24\">No data in selected range<\u002Fp>'; return; }\n            const n = dailyData.length;\n            const W = 780, H = 300, pL = 66, pR = 58, pT = 24, pB = 52;\n            const cW = W - pL - pR, cH = H - pT - pB;\n            const maxSales = niceCeil(Math.max(...dailyData.map(d => d.salesWithOffer)) * 1.35);\n            const maxRed = niceCeil(Math.max(...dailyData.map(d => d.redemptionCount)) * 1.35);\n            let svg = '<svg viewBox=\"0 0 '+W+' '+H+'\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;height:100%;\" preserveAspectRatio=\"xMidYMid meet\" font-family=\"Inter,sans-serif\">';\n            for (let i = 0; i <= 4; i++) {\n                const y = pT + cH * (1 - i/4);\n                svg += '<line x1=\"'+pL+'\" y1=\"'+y+'\" x2=\"'+(W-pR)+'\" y2=\"'+y+'\" stroke=\"#e5e7eb\" stroke-dasharray=\"4,4\"/>';\n                svg += '<text x=\"'+(pL-12)+'\" y=\"'+(y+4)+'\" text-anchor=\"end\" fill=\"#4f46e5\" font-size=\"12\" font-weight=\"700\">$'+Math.round(maxSales*i/4).toLocaleString()+'<\u002Ftext>';\n                svg += '<text x=\"'+(W-pR+12)+'\" y=\"'+(y+4)+'\" text-anchor=\"start\" fill=\"#232e7c\" font-size=\"12\" font-weight=\"700\">'+Math.round(maxRed*i/4).toLocaleString()+'<\u002Ftext>';\n            }\n            svg += '<line x1=\"'+pL+'\" y1=\"'+(pT+cH)+'\" x2=\"'+(W-pR)+'\" y2=\"'+(pT+cH)+'\" stroke=\"#d1d5db\" stroke-width=\"1\"/>';\n            const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];\n            const slotW = cW / n;\n            const barW = Math.min(34, slotW * 0.5);\n            const labelEvery = Math.max(1, Math.ceil(n / 10));\n            dailyData.forEach(function(d, i) {\n                const cx = pL + slotW * (i + 0.5);\n                const barH = (d.salesWithOffer / maxSales) * cH;\n                svg += '<rect x=\"'+(cx - barW/2).toFixed(1)+'\" y=\"'+(pT+cH-barH).toFixed(1)+'\" width=\"'+barW.toFixed(1)+'\" height=\"'+barH.toFixed(1)+'\" rx=\"5\" fill=\"#c7d2fe\"/>';\n            });\n            let linePath = dailyData.map(function(d, i) { const cx = pL + slotW*(i+0.5); const y = pT + cH*(1 - d.redemptionCount/maxRed); return (i===0?'M':'L')+cx.toFixed(1)+','+y.toFixed(1); }).join(' ');\n            svg += '<path d=\"'+linePath+'\" fill=\"none\" stroke=\"#232e7c\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>';\n            dailyData.forEach(function(d, i) {\n                const cx = pL + slotW * (i + 0.5);\n                svg += '<circle cx=\"'+cx.toFixed(1)+'\" cy=\"'+(pT+cH*(1-d.redemptionCount/maxRed)).toFixed(1)+'\" r=\"5\" fill=\"#232e7c\"/>';\n            });\n            dailyData.forEach(function(d, i) {\n                if (i % labelEvery === 0 || i === n-1) {\n                    const cx = pL + slotW * (i + 0.5);\n                    svg += '<text x=\"'+cx.toFixed(1)+'\" y=\"'+(H-pB+20)+'\" text-anchor=\"middle\" fill=\"#4b5563\" font-size=\"12\" font-weight=\"600\">'+months[d.date.getMonth()]+'<\u002Ftext>';\n                    svg += '<text x=\"'+cx.toFixed(1)+'\" y=\"'+(H-pB+36)+'\" text-anchor=\"middle\" fill=\"#4b5563\" font-size=\"12\" font-weight=\"600\">'+String(d.date.getDate()).padStart(2,'0')+'<\u002Ftext>';\n                }\n            });\n            svg += '<\u002Fsvg>';\n            container.innerHTML = svg;\n        }\n\n        function renderOfferTable(dailyData) {\n            const tbody = document.getElementById('od-lst-table-body');\n            if (!tbody) return;\n            const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];\n            if (!dailyData.length) { tbody.innerHTML = '<tr><td colspan=\"3\" class=\"py-8 text-center text-gray-400 text-sm\">No data in selected range<\u002Ftd><\u002Ftr>'; return; }\n            tbody.innerHTML = dailyData.map(function(d, i) {\n                const dateLabel = months[d.date.getMonth()] + ' ' + String(d.date.getDate()).padStart(2,'0');\n                const rowBg = (i % 2 === 1) ? 'background:#fafbfc;' : '';\n                return '<tr style=\"border-bottom:1px solid #f1f5f9;'+rowBg+'\">'\n                    + '<td class=\"py-3.5 px-4 font-bold\" style=\"color:#64748b;\">'+dateLabel+'<\u002Ftd>'\n                    + '<td class=\"py-3.5 px-4 text-center font-bold\" style=\"color:#4f46e5;\">$'+d.salesWithOffer.toLocaleString()+'<\u002Ftd>'\n                    + '<td class=\"py-3.5 px-4 text-right font-bold\" style=\"color:#1e293b;\">'+d.redemptionCount.toLocaleString()+'<\u002Ftd>'\n                    + '<\u002Ftr>';\n            }).join('');\n        }\n\n        function toggleOfferView() {\n            offerView = (offerView === 'chart') ? 'table' : 'chart';\n            const chartWrap = document.getElementById('od-lst-chart-wrap');\n            const tableWrap = document.getElementById('od-lst-table-wrap');\n            const icon = document.getElementById('od-lst-toggle-icon');\n            if (offerView === 'table') {\n                chartWrap.classList.add('hidden'); tableWrap.classList.remove('hidden');\n                icon.innerHTML = '<line x1=\"2\" y1=\"16\" x2=\"2\" y2=\"10\" stroke=\"#6b7280\" stroke-width=\"1.8\" stroke-linecap=\"round\"/><line x1=\"7\" y1=\"16\" x2=\"7\" y2=\"4\" stroke=\"#6b7280\" stroke-width=\"1.8\" stroke-linecap=\"round\"/><line x1=\"12\" y1=\"16\" x2=\"12\" y2=\"8\" stroke=\"#6b7280\" stroke-width=\"1.8\" stroke-linecap=\"round\"/><line x1=\"17\" y1=\"16\" x2=\"17\" y2=\"2\" stroke=\"#6b7280\" stroke-width=\"1.8\" stroke-linecap=\"round\"/>';\n            } else {\n                tableWrap.classList.add('hidden'); chartWrap.classList.remove('hidden');\n                icon.innerHTML = '<rect x=\"1\" y=\"1\" width=\"7\" height=\"7\" rx=\"1.5\" stroke=\"#6b7280\" stroke-width=\"1.5\" fill=\"none\"/><rect x=\"10\" y=\"1\" width=\"7\" height=\"7\" rx=\"1.5\" stroke \n            let svg = '<svg viewBox=\"0 0 ' + W + ' ' + H + '\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;height:100%;\" preserveAspectRatio=\"xMidYMid meet\" font-family=\"Inter,sans-serif\">';\n            for (let i = 0; i <= 4; i++) {\n                const y = pT + cH * (1 - i/4);\n                svg += '<line x1=\"' + pL + '\" y1=\"' + y + '\" x2=\"' + (W-pR) + '\" y2=\"' + y + '\" stroke=\"#e5e7eb\" stroke-dasharray=\"4,4\"/>';\n                svg += '<text x=\"' + (pL-12) + '\" y=\"' + (y+4) + '\" text-anchor=\"end\" fill=\"#4f46e5\" font-size=\"12\" font-weight=\"700\">' + comboFmt(maxBar*i/4, cfg.barMoney) + '<\u002Ftext>';\n                svg += '<text x=\"' + (W-pR+12) + '\" y=\"' + (y+4) + '\" text-anchor=\"start\" fill=\"#232e7c\" font-size=\"12\" font-weight=\"700\">' + comboFmt(maxLine*i/4, cfg.lineMoney) + '<\u002Ftext>';\n            }\n            svg += '<line x1=\"' + pL + '\" y1=\"' + (pT+cH) + '\" x2=\"' + (W-pR) + '\" y2=\"' + (pT+cH) + '\" stroke=\"#d1d5db\" stroke-width=\"1\"/>';\n            const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];\n            const slotW = cW / n;\n            const barW = Math.min(34, slotW * 0.5);\n            const labelEvery = Math.max(1, Math.ceil(n / 10));\n            data.forEach(function(d, i) {\n                const cx = pL + slotW * (i + 0.5);\n                const barH = (d[cfg.barField] / maxBar) * cH;\n                svg += '<rect x=\"' + (cx - barW/2).toFixed(1) + '\" y=\"' + (pT+cH-barH).toFixed(1) + '\" width=\"' + barW.toFixed(1) + '\" height=\"' + barH.toFixed(1) + '\" rx=\"5\" fill=\"#c7d2fe\"/>';\n            });\n            let linePath = data.map(function(d, i) { const cx = pL + slotW*(i+0.5); const y = pT + cH*(1 - d[cfg.lineField]/maxLine); return (i===0?'M':'L') + cx.toFixed(1) + ',' + y.toFixed(1); }).join(' ');\n            svg += '<path d=\"' + linePath + '\" fill=\"none\" stroke=\"#232e7c\" stroke-width=\"2.5\" stroke-li  white:  'bg-white',\n                    pink:   'bg-gradient-to-b from-[#f6dfe7] to-white',\n                    orange: 'bg-gradient-to-b from-[#f6e6e2] to-white'\n                };\n                const bg = bgByTheme[app.theme] || bgByTheme.white;\n                return `\n                    <button data-app-id=\"${app.id}\" class=\"app-tile group text-left ${bg} border border-gray-300 rounded-2xl p-4 aspect-[214/229] flex flex-col items-center justify-between shadow-[0_1px_3px_rgba(0,0,0,0.04)] hover:shadow-[0_4px_12px_rgba(0,0,0,0.08)] hover:-translate-y-0.5 transition-all cursor-pointer\">\n                        <div class=\"flex-1 flex items-center justify-center w-full pt-1 pb-2\">\n                            <div class=\"w-[60%] aspect-square flex items-center justify-center\">${app.icon}<\u002Fdiv>\n                        <\u002Fdiv>\n                        <div class=\"text-[15px] font-semibold text-gray-900 text-center leading-tight\">${app.name}<\u002Fdiv>\n                    <\u002Fbutton>\n                `;\n            }).join('');\n            // Wire click handlers\n            grid.querySelectorAll('.app-tile').forEach(btn => {\n                btn.addEventListener('click', () => {\n                    const id = btn.getAttribute('data-app-id');\n                    if (id === 'plum-loyalty') {\n                        showView('dashboard');\n                    } else {\n                        // Non-loyalty apps: no-op for prototype (could show a toast later)\n                        btn.classList.add('opacity-70');\n                        setTimeout(() => btn.classList.remove('opacity-70'), 150);\n                    }\n                });\n            });\n        }\n\n        // Detect sandboxed / cross-origin iframe context where pushState is forbidden.\n        // In artifacts and similar previews the file runs inside an about:srcdoc iframe\n        // which blocks History API mutations.\n        function safePushState(state, hash) {\n            try {\n                if (window.history && window.history.pushState) {\n                    window.history.pushState(state, '', hash);\n                }\n            } catch (e) {\n                // Silently ignore — view switching still works without URL sync.\n            }\n        }\n\n        function showView(name) {\n            const launcher = document.getElementById('view-launcher');\n            const dashboard = document.getElementById('view-dashboard');\n            if (name === 'dashboard') {\n                launcher.classList.add('hidden');\n                dashboard.classList.remove('hidden');\n                // Refresh KPI values for the currently selected period\n                updateKpis();\n                safePushState({ view: 'dashboard' }, '#dashboard');\n            } else {\n                dashboard.classList.add('hidden');\n                launcher.classList.remove('hidden');\n                safePushState({ view: 'launcher' }, '#');\n            }\n        }\n\n        // Browser Back button between the two views (no-op in sandboxed iframes)\n        window.addEventListener('popstate', () => {\n            try {\n                if (location.hash === '#dashboard') showView('dashboard');\n                else showView('launcher');\n            } catch (e) { /* ignore */ }\n        });\n\n        // Wire the Plum logo (sidebar top) to go back to launcher\n        // AND wire the search box to filter tiles live\n        document.addEventListener('DOMContentLoaded', () => {\n            const searchInput = document.getElementById('launcher-search');\n            if (searchInput) searchInput.addEventListener('input', renderLauncherTiles);\n            const sidebarLogo = document.querySelector('#view-dashboard aside > div:first-child');\n            if (sidebarLogo) {\n                sidebarLogo.classList.add('cursor-pointer');\n                sidebarLogo.title = 'Back to My Apps';\n                sidebarLogo.addEventListener('click', () => showView('launcher'));\n            }\n        });\n\n        // Initial launcher render (runs immediately since the launcher is the default view)\n        renderLauncherTiles();\n\n        // ============================================================\n        // KPI card extras: WTD figure + Today/WTD vs LW/LY comparison %\n        // Additive only — does not read from or modify kpiByPeriod's\n        // consumers, updateKpis(), or any existing function/behavior.\n        // ============================================================\n        // WTD figure per card reuses the existing 'This Week' bucket already\n        // defined in kpiByPeriod above (no new totals invented).\n        const kpiCompareStats = {\n            totalSales:   { todayLW: '1.10%', todayLY: '2.35%', wtdLW: '3.05%', wtdLY: '2.80%' },\n            loyaltySales: { todayLW: '0.85%', todayLY: '1.20%', wtdLW: '2.40%', wtdLY: '1.58%' },\n            salesOffer:   { todayLW: '1.45%', todayLY: '2.10%', wtdLW: '1.90%', wtdLY: '2.65%' },\n            redemptions:  { todayLW: '0.95%', todayLY: '1.75%', wtdLW: '2.20%', wtdLY: '1.40%' },\n            loyaltyTrans: { todayLW: '1.60%', todayLY: '2.90%', wtdLW: '3.35%', wtdLY: '2.05%' },\n            loyaltyAvg:   { todayLW: '0.40%', todayLY: '0.95%', wtdLW: '1.15%', wtdLY: '0.70%' },\n            spendLift:    { todayLW: '0.55%', todayLY: '1.05%', wtdLW: '0.85%', wtdLY: '1.30%' }\n        };\n\n        function renderKpiCardExtras() {\n            const wtdSource = kpiByPeriod['This Week'] || {};\n            document.querySelectorAll('[data-kpi-wtd]').forEach(el => {\n                const k = el.getAttribute('data-kpi-wtd');\n                if (wtdSource[k] !== undefined) el.textContent = wtdSource[k];\n            });\n            Object.keys(kpiCompareStats).forEach(k => {\n                const s = kpiCompareStats[k];\n                const map = { 'data-kpi-todaylw': s.todayLW, 'data-kpi-todayly': s.todayLY, 'data-kpi-wtdlw': s.wtdLW, 'data-kpi-wtdly': s.wtdLY };\n                Object.keys(map).forEach(attr => {\n                    const el = document.querySelector(`[${attr}=\"${k}\"]`);\n                    if (el) el.textContent = map[attr];\n                });\n            });\n        }\n        renderKpiCardExtras();\n        renderKpiTileSparklines();\n\n        // On refresh, always start at the launcher — never restore into the dashboard from\n        // a leftover #dashboard hash. Clear the hash quietly if it's there.\n        if (location.hash) {\n            try {\n                if (window.history && window.history.replaceState) {\n                    window.history.replaceState({ view: 'launcher' }, '', location.pathname + location.search);\n                }\n            } catch (e) { /* sandboxed iframe — ignore */ }\n        }\n    <\u002Fscript>\n\n<\u002Fbody><\u002Fhtml>"
  </script>
