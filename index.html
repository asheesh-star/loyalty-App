oolean);\n        }\n        function getRootRow(id) {\n            const base = rootBaseRows().find(r => r.id === id);\n            return base ? rowForRange(base, getActiveRange()) : null;\n        }\n\n        function storesForRoot(rootRow) {\n            const f = storeFactor() || 1;\n            const defs = selectedStoreDefs().map(d => ({ ...d, share: d.share / f }));\n            return splitByShare(rootRow, defs).map((r, i) => ({ ...r, rootId: rootRow.id, storeDefIdx: STORE_DEFS.findIndex(x => x.id === defs[i].id) }));\n        }\n        // Weeks = the Sun–Sat calendar weeks inside the row's active window.\n        function weeksForStore(rootRow, storeRow) {\n            const from = new Date(rootRow._ovFrom + 'T00:00:00'), to = new Date(rootRow._ovTo + 'T00:00:00');\n            const buckets = [];\n            let ws = addDays(from, -from.getDay());\n            while (ws <= to) {\n                const we = addDays(ws, 6);\n                const bFrom = ws < from ? from : ws, bTo = we > to ? to : we;\n                let w = 0;\n                for (let d = new Date(bFrom); d <= bTo; d = addDays(d, 1)) w += DOW_WEIGHT[d.getDay()];\n                buckets.push({ from: bFrom, to: bTo, weight: w });\n                ws = addDays(ws, 7);\n            }\n            const total = buckets.reduce((a, b) => a + b.weight, 0) || 1;\n            const defs = buckets.map(b => ({\n                id: 'W' + toISODate(b.from),\n                name: 'Week ' + MON_SHORT[b.from.getMonth()] + ' ' + b.from.getDate(),\n                sub: isSameDay(b.from, b.to) ? fmtMDY(b.from) : fmtMDY(b.from) + ' – ' + fmtMDY(b.to),\n                share: b.weight / total,\n                _from: toISODate(b.from), _to: toISODate(b.to)\n            }));\n            return splitByShare(storeRow, defs).map((r, i) => ({ ...r, _from: defs[i]._from, _to: defs[i]._to, rootId: rootRow.id, storeId: storeRow.id }));\n        }\n        // Days = each calendar date inside the chosen week.\n        function daysForWeek(rootRow, storeRow, weekRow) {\n            const from = new Date(weekRow._from + 'T00:00:00'), to = new Date(weekRow._to + 'T00:00:00');\n            const dates = [];\n            for (let d = new Date(from); d <= to; d = addDays(d, 1)) dates.push(new Date(d));\n            const total = dates.reduce((a, d) => a + DOW_WEIGHT[d.getDay()], 0) || 1;\n            const defs = dates.map(d => ({\n                id: 'D' + toISODate(d),\n                name: DOW_SHORT[d.getDay()] + ', ' + MON_SHORT[d.getMonth()] + ' ' + d.getDate(),\n                sub: fmtMDY(d),\n                share: DOW_WEIGHT[d.getDay()] / total\n            }));\n            return splitByShare(weekRow, defs).map(r => ({ ...r, rootId: rootRow.id, storeId: storeRow.id, weekId: weekRow.id }));\n        }\n\n        // ----------------------------------------------------\n        // Shared cell renderer: bold value + small % subtext +\n        // tiny inline sparkline (clickable -> opens the trend modal).\n        // ----------------------------------------------------\n        function seededRand(seed) {\n            let x = Math.sin(seed) * 10000;\n            return x - Math.floor(x);\n        }\n        function sparklinePath(seedKey, points) {\n            const w = 32, h = 14;\n            const vals = [];\n            for (let i = 0; i < points; i++) {\n                let s = 0;\n                for (let c = 0; c < seedKey.length; c++) s += seedKey.charCodeAt(c) * (i + 1);\n                vals.push(0.25 + seededRand(s) * 0.75);\n            }\n            const step = w / (points - 1);\n            const d = vals.map((v, i) => `${i === 0 ? 'M' : 'L'}${(i * step).toFixed(1)},${(h - v * h).toFixed(1)}`).join(' ');\n            return { d, w, h };\n        }\n        function metricCell(rowId, colKey, displayValue, colorHex, rowLabel, metricLabel, format) {\n            const seedKey = rowId + ':' + colKey;\n            const { d, w, h } = sparklinePath(seedKey, 8);\n            let s = 0;\n            for (let c = 0; c < seedKey.length; c++) s += seedKey.charCodeAt(c);\n            const pct = (seededRand(s) * 4).toFixed(2);\n            const safeRowLabel = (rowLabel || rowId).replace(/'/g, \"\\\\'\");\n            const safeMetricLabel = (metricLabel || colKey).replace(/'/g, \"\\\\'\");\n            const baseVal = parseFloat(String(displayValue).replace(/[^0-9.\\-]/g, '')) || 0;\n            return `<div class=\"flex flex-col items-end gap-0.5\">\n                <span class=\"font-bold text-gray-900 text-[12.5px]\">${displayValue}<\u002Fspan>\n                <span class=\"text-[9.5px] font-semibold\" style=\"color:${colorHex}\">${pct}%<\u002Fspan>\n                <svg width=\"${w}\" height=\"${h}\" viewBox=\"0 0 ${w} ${h}\" class=\"opacity-80 cursor-pointer hover:opacity-100 transition\" onclick=\"event.stopPropagation(); openMetricTrend('${seedKey}', '${safeRowLabel}', '${safeMetricLabel}', '${colorHex}', '${format || 'count'}', ${baseVal})\"><path d=\"${d}\" fill=\"none\" stroke=\"${colorHex}\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><\u002Fsvg>\n            <\u002Fdiv>`;\n        }\n\n        // ----------------------------------------------------\n        // Metric Trend Modal — reproduces the reference's zoom chart:\n        // title/subtitle, By day/By week toggle, Latest/Change/Average/Peak\n        // stats, filled line chart with gridlines, hoverable points, footer.\n        // ----------------------------------------------------\n        let metricTrendState = null; // { seedKey, rowLabel, metricLabel, color, format, gran }\n\n        function seededSeries(seedKey, gran, points) {\n            const n = gran === 'week' ? 8 : 30;\n            const vals = [];\n            for (let i = 0; i < n; i++) {\n                let s = 0;\n                const k = seedKey + ':' + gran + ':' + i;\n                for (let c = 0; c < k.length; c++) s += k.charCodeAt(c) * (i + 3);\n                vals.push(seededRand(s));\n            }\n            return vals;\n        }\n\n        function metricTrendLabels(gran) {\n            const n = gran === 'week' ? 8 : 30;\n            const labels = [];\n            if (gran === 'week') {\n                for (let i = 0; i < n; i++) labels.push('Week ' + (28 + i));\n            } else {\n                const base = new Date(2026, 5, 1);\n                for (let i = 0; i < n; i++) {\n                    const d = new Date(base);\n                    d.setDate(base.getDate() + i);\n                    labels.push(d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }));\n                }\n            }\n            return labels;\n        }\n\n        function fmtMetricVal(v, format) {\n            if (format === 'moneyc') return '$' + v.toFixed(2);\n            if (format === 'money') return '$' + Math.round(v).toLocaleString();\n            if (format === 'percent') return v.toFixed(2) + '%';\n            return Math.round(v).toLocaleString();\n        }\n\n        function openMetricTrend(seedKey, rowLabel, metricLabel, color, format, base) {\n            metricTrendState = { seedKey, rowLabel, metricLabel, color, format, base, gran: 'day' };\n            document.getElementById('metric-trend-modal').classList.remove('hidden');\n            renderMetricTrend();\n        }\n        function closeMetricTrend() {\n            document.getElementById('metric-trend-modal').classList.add('hidden');\n            metricTrendState = null;\n        }\n        function setMetricTrendGran(gran) {\n            if (!metricTrendState) return;\n            metricTrendState.gran = gran;\n            renderMetricTrend();\n        }\n\n        function renderMetricTrend() {\n            const st = metricTrendState;\n            if (!st) return;\n            const format = st.format;\n            const gran = st.gran;\n\n            document.getElementById('mt-title').textContent = st.rowLabel;\n            document.getElementById('mt-sub').textContent = st.metricLabel + ' · ' + (gran === 'week' ? 'weekly' : 'daily') + ' trend';\n            document.getElementById('mt-unit').textContent = (format === 'money' || format === 'moneyc') ? 'dollars' : (format === 'percent' ? (st.kpi ? 'percent' : '% of net sales') : 'count');\n\n            // Toggle button styling\n            ['day', 'week'].forEach(g => {\n                const btn = document.getElementById('mt-gran-' + g);\n                if (g === gran) {\n                    btn.className = 'px-3 py-1.5 rounded-md text-[12.5px] font-semibold border transition bg-[#9b2c5c] text-white border-[#9b2c5c]';\n                } else {\n                    btn.className = 'px-3 py-1.5 rounded-md text-[12.5px] font-semibold border transition bg-white text-gray-700 border-gray-300 hover:border-gray-400';\n                }\n            });\n\n            // Build the series: scale the 0..1 random values into a plausible\n            // range around the row's current metric value.\n            const rawVals = seededSeries(st.seedKey, gran);\n            const scale = format === 'money' ? 4000 : (format === 'percent' ? 3 : 400);\n            const floor = format === 'money' ? 200 : (format === 'percent' ? 0.2 : 20);\n            // Averages (e.g. Avg. Campaign Check) trend around the row's actual value, ending on it.\n            const vals = st.kpi\n                ? rawVals.map((v, i) => {\n                    const mult = st.kpi.rate ? 1 : (gran === 'week' ? 7 : 1);\n                    const b = (st.base || 0) * mult;\n                    if (i === rawVals.length - 1) return b;\n                    return st.kpi.rate ? b * (0.9 + v * 0.2) : b * (0.65 + v * 0.7);\n                })\n                : format === 'moneyc'\n                ? rawVals.map((v, i) => i === rawVals.length - 1 ? (st.base || 0) : (st.base || 0) * (0.85 + v * 0.3))\n                : rawVals.map(v => floor + v * scale);\n            const labels = metricTrendLabels(gran);\n            const n = vals.length;\n\n            const last = vals[n - 1], first = vals[0];\n            const delta = last - first;\n            const peakVal = Math.max.apply(null, vals);\n            const peakIdx = vals.indexOf(peakVal);\n            const avg = vals.reduce((a, v) => a + v, 0) / n;\n\n            document.getElementById('mt-latest').textContent = fmtMetricVal(last, format);\n            document.getElementById('mt-latest').style.color = st.color;\n            document.getElementById('mt-change').textContent = (delta >= 0 ? '+' : '-') + (format === 'moneyc' ? ('$' + Math.abs(delta).toFixed(2)) : format === 'money' ? ('$' + Math.round(Math.abs(delta)).toLocaleString()) : format === 'percent' ? (Math.abs(delta).toFixed(2) + 'pt') : Math.round(Math.abs(delta)).toLocaleString());\n            document.getElementById('mt-change').style.color = delta >= 0 ? st.color : '#047857';\n            document.getElementById('mt-average').textContent = fmtMetricVal(avg, format);\n            document.getElementById('mt-peak').textContent = fmtMetricVal(peakVal, format);\n            document.getElementById('mt-peak').style.color = st.color;\n            document.getElementById('mt-peak-label').textContent = labels[peakIdx] || '';\n\n            document.getElementById('mt-footer-left').textContent = n + ' points';\n            document.getElementById('mt-footer-right').textContent = 'Hover for the exact value';\n\n            // Chart geometry (matches reference proportions)\n            const W = 720, H = 262, L = 52, R = 14, T = 16, B = 30;\n            const lo0 = Math.min.apply(null, vals), hi0 = Math.max.apply(null, vals);\n            let lo = lo0, hi = hi0;\n            const span = hi - lo;\n            const pad = span > 0 ? span * 0.18 : (Math.abs(hi) * 0.12 || 1);\n            lo -= pad; hi += pad;\n            if (lo < 0 && lo0 >= 0) lo = 0;\n            if (!(hi > lo)) hi = lo + 1;\n            const X = i => n === 1 ? L + (W - L - R) / 2 : L + (i / (n - 1)) * (W - L - R);\n            const Y = v => (H - B) - Math.min(1, Math.max(0, (v - lo) / (hi - lo))) * (H - B - T);\n            const step = n === 1 ? (W - L - R) : (W - L - R) / (n - 1);\n\n            const gridVals = [0, 0.25, 0.5, 0.75, 1].map(f => lo + (hi - lo) * f);\n            const gridLines = gridVals.map(gv => `<line x1=\"${L}\" y1=\"${Y(gv).toFixed(1)}\" x2=\"${W - R}\" y2=\"${Y(gv).toFixed(1)}\" stroke=\"#EDEFF3\" stroke-width=\"1\"/>`).join('');\n            const gridLabels = gridVals.map(gv => `<div style=\"position:absolute; left:0; top:${Y(gv).toFixed(1)}px; width:46px; text-align:right; transform:translateY(-50%); font-family:ui-monospace,monospace; font-size:11px; color:#6b7280;\">${fmtMetricVal(gv, format)}<\u002Fdiv>`).join('');\n\n            const every = Math.max(1, Math.ceil(n / 6));\n            const xKeep = [];\n            for (let i = 0; i < n; i++) {\n                if (!(i % every === 0 || i === n - 1)) continue;\n                if (i === n - 1) { while (xKeep.length && X(i) - X(xKeep[xKeep.length - 1]) < (W - L - R) * 0.11) xKeep.pop(); }\n                xKeep.push(i);\n            }\n            const xLabels = xKeep.map(i => {\n                const shift = i === 0 ? '0%' : (i === n - 1 ? '-100%' : '-50%');\n                return `<div style=\"position:absolute; top:236px; left:${((X(i) / W) * 100).toFixed(2)}%; transform:translateX(${shift}); white-space:nowrap; font-family:ui-monospace,monospace; font-size:10.5px; color:#6b7280;\">${labels[i]}<\u002Fdiv>`;\n            }).join('');\n            const xTicks = xKeep.map(i => `<line x1=\"${X(i).toFixed(1)}\" y1=\"${H - B}\" x2=\"${X(i).toFixed(1)}\" y2=\"${H - B + 5}\" stroke=\"#D1D5DB\" stroke-width=\"1\"/>`).join('');\n\n            const poly = vals.map((v, i) => X(i).toFixed(1) + ',' + Y(v).toFixed(1)).join(' ');\n            const area = 'M' + X(0).toFixed(1) + ',' + (H - B) + ' L' + vals.map((v, i) => X(i).toFixed(1) + ',' + Y(v).toFixed(1)).join(' L') + ' L' + X(n - 1).toFixed(1) + ',' + (H - B) + ' Z';\n\n            const dots = vals.map((v, i) => `<circle cx=\"${X(i).toFixed(1)}\" cy=\"${Y(v).toFixed(1)}\" r=\"2.6\" fill=\"${st.color}\"/>`).join('');\n            const hits = vals.map((v, i) => {\n                const hx = Math.max(0, X(i) - step / 2).toFixed(1);\n                return `<rect x=\"${hx}\" y=\"${T}\" width=\"${step.toFixed(1)}\" height=\"${H - B - T}\" fill=\"transparent\"><title>${labels[i]} · ${fmtMetricVal(v, format)}<\u002Ftitle><\u002Frect>`;\n            }).join('');\n\n            const chartHtml = `\n                <div style=\"position:relative; height:${H}px;\">\n                    ${gridLabels}\n                    ${xLabels}\n                    <svg viewBox=\"0 0 ${W} ${H}\" width=\"100%\" height=\"${H}\" preserveAspectRatio=\"none\" style=\"display:block;\">\n                        ${gridLines}\n                        <line x1=\"${L}\" y1=\"${H - B}\" x2=\"${W - R}\" y2=\"${H - B}\" stroke=\"#D1D5DB\" stroke-width=\"1\"/>\n                        <line x1=\"${L}\" y1=\"${T}\" x2=\"${L}\" y2=\"${H - B}\" stroke=\"#D1D5DB\" stroke-width=\"1\"/>\n                        ${xTicks}\n                        <path d=\"${area}\" fill=\"${st.color}\" opacity=\"0.09\"><\u002Fpath>\n                        <polyline points=\"${poly}\" fill=\"none\" stroke=\"${st.color}\" stroke-width=\"2.2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\n                        ${dots}\n                        ${hits}\n                    <\u002Fsvg>\n                <\u002Fdiv>`;\n            document.getElementById('mt-chart-wrap').innerHTML = chartHtml;\n        }\n\n        // ----------------------------------------------------\n        // Drill icons — colored circular badges in the Action column,\n        // maroon-toned per dimension (reference used blue/amber/violet;\n        // here everything stays in the Loyalty brand's maroon family).\n        // ----------------------------------------------------\n        const DRILL_TONE = {\n            campaign: { bg: '#f7e6ee', fg: '#b0386b' },\n            store: { bg: '#fbe4ee', fg: '#9b2c5c' },\n            week:  { bg: '#f3d9e6', fg: '#7d1a3f' },\n            day:   { bg: '#ecd0de', fg: '#5c1230' }\n        };\n        const DRILL_ICON_SVG = {\n            campaign: '<path d=\"M3 11v2a1 1 0 001 1h2l5 4V6L6 10H4a1 1 0 00-1 1z\"/><path d=\"M15 9a3 3 0 010 6\"/><path d=\"M18 6a7 7 0 010 12\"/>',\n            store: '<path d=\"M3 9l1.5-5h15L21 9\"/><path d=\"M4 9v11h16V9\"/><path d=\"M3 9a3 3 0 006 0 3 3 0 006 0 3 3 0 006 0\"/>',\n            week:  '<rect x=\"3\" y=\"5\" width=\"18\" height=\"16\" rx=\"2\"/><path d=\"M3 10h18M8 3v4M16 3v4\"/>',\n            day:   '<path d=\"M21 11V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2h6\"/><path d=\"M3 10h18M8 3v4M16 3v4\"/><circle cx=\"17.5\" cy=\"17.5\" r=\"4\"/><path d=\"M17.5 15.8v1.9l1.2.8\"/>'\n        };\n        function drillIcon(dim, title, onclickJs) {\n            const tone = DRILL_TONE[dim];\n            return `<button type=\"button\" onclick=\"${onclickJs}\" title=\"${title}\" class=\"w-6 h-6 rounded-full flex items-center justify-center transition hover:brightness-95 flex-shrink-0\" style=\"background:${tone.bg}; color:${tone.fg};\">\n                <svg width=\"12\" height=\"12\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">${DRILL_ICON_SVG[dim]}<\u002Fsvg>\n            <\u002Fbutton>`;\n        }\n        function actionCell(drills, eyeButtonHtml) {\n            return `<div class=\"flex items-center gap-1 justify-center\">${drills.join('')}${eyeButtonHtml || ''}<\u002Fdiv>`;\n        }\n\n        // ----------------------------------------------------\n        // Breadcrumb / drill path state.\n        // path is an array of steps beyond the campaign root:\n        //   { dim: 'store', rootId, id, label }\n        //   { dim: 'week',  rootId, storeId, id, label }\n        //   { dim: 'day',   rootId, storeId, weekId, id, label }\n        // path.length === 0 means we're at the Campaign/Offers root (same for both).\n        // ----------------------------------------------------\n        let drillPath = [];\n        let currentTab = 'campaign';      // campaign/offers sub-toggle (only used at root)\n        let paginationState = { page: 1, pageSize: 10 };\n\n        // Avg check is derived (not stored/scaled) so it stays coherent at every drill level.\n        function avgCheckOf(row) { return row.loyaltyTrans > 0 ? row.salesOffer / row.loyaltyTrans : 0; }\n        function redemptionRateOf(row) { return row.users > 0 ? (row.redemptionCount / row.users) * 100 : 0; }\n\n        function loyaltyAvgCheckOf(row) { return row.loyaltyTrans > 0 ? row.loyaltySales / row.loyaltyTrans : 0; }\n        function metricCols(dim) {\n            const lead = dim === 'store'\n                ? [\n                    { label: 'Franchise Name', key: null, render: (v, row) => STORE_FRANCHISE[row.id] || '—' },\n                    { label: 'Site ID', key: 'id', render: v => v },\n                    { label: 'Site Name', key: 'sub', render: v => `<span class=\"font-semibold text-gray-900\">${v}<\u002Fspan>` }\n                  ]\n                : [{ label: dim === 'week' ? 'Week Start Date' : 'Business Date', key: 'name', render: labelWithSub }];\n            if (dim === 'store' || dim === 'week' || dim === 'day') return [\n                ...lead,\n                { label: 'Net Sales', key: 'netSales', render: (v, row) => metricCell(row.id, 'netSales', `$${v.toLocaleString()}`, '#2c8ec8', row.name, 'Net Sales', 'money'), align: 'right' },\n                { label: 'Loyalty Sales', key: 'loyaltySales', render: (v, row) => metricCell(row.id, 'loyaltySales', `$${v.toLocaleString()}`, '#f47a3d', row.name, 'Loyalty Sales', 'money'), align: 'right' },\n                { label: 'Sales With Offer', key: 'salesOffer', render: (v, row) => metricCell(row.id, 'salesOffer', `$${v.toLocaleString()}`, '#eab308', row.name, 'Sales With Offer', 'money'), align: 'right' },\n                { label: 'Redemption Amount', key: 'redemptionAmount', render: (v, row) => metricCell(row.id, 'redemptionAmount', `$${v.toLocaleString()}`, '#c73b32', row.name, 'Redemption Amount', 'money'), align: 'right' },\n                { label: 'Loyalty Transaction', key: 'loyaltyTrans', render: (v, row) => metricCell(row.id, 'loyaltyTrans', v.toLocaleString(), '#6b6ab9', row.name, 'Loyalty Transaction', 'count'), align: 'right' },\n                { label: 'Loyalty Avg. Check', key: null, render: (v, row) => metricCell(row.id, 'loyaltyAvgCheck', `$${loyaltyAvgCheckOf(row).toFixed(2)}`, '#22a08a', row.name, 'Loyalty Avg. Check', 'moneyc'), align: 'right' },\n                { label: 'Action(s)', key: null, align: 'center', render: (x, row) => actionCell([rowActions(dim, row)]) }\n            ];\n            const nameCols = dim === 'store'\n                ? [\n                    { label: 'Site ID', key: 'id', render: v => v },\n                    { label: 'Site Name', key: 'sub', render: v => `<span class=\"font-semibold text-gray-900\">${v}<\u002Fspan>` }\n                  ]\n                : [{ label: dim === 'week' ? 'Week Start Date' : 'Business Date', key: 'name', render: labelWithSub }];\n            const isOffer = currentTab === 'offers';\n            const salesLabel = isOffer ? 'Sales with Offer' : 'Campaign Sales';\n            const avgLabel = isOffer ? 'Avg. Offer Check' : 'Avg. Campaign Check';\n            const transCol = isOffer\n                ? { label: 'Offer Redeemed', key: 'redemptionCount', render: (v, row) => metricCell(row.id, 'redemptionCount', v.toLocaleString(), '#6b6ab9', row.name, 'Offer Redeemed', 'count'), align: 'right' }\n                : { label: 'Campaign Transactions', key: 'loyaltyTrans', render: (v, row) => metricCell(row.id, 'loyaltyTrans', v.toLocaleString(), '#6b6ab9', row.name, 'Campaign Transactions', 'count'), align: 'right' };\n            return [\n                ...nameCols,\n                { label: 'Net Sales', key: 'netSales', render: (v, row) => metricCell(row.id, 'netSales', `$${v.toLocaleString()}`, '#2c8ec8', row.name, 'Net Sales', 'money'), align: 'right' },\n                { label: 'Loyalty Sales', key: 'loyaltySales', render: (v, row) => metricCell(row.id, 'loyaltySales', `$${v.toLocaleString()}`, '#f47a3d', row.name, 'Loyalty Sales', 'money'), align: 'right' },\n                { label: salesLabel, key: 'salesOffer', render: (v, row) => metricCell(row.id, 'salesOffer', `$${v.toLocaleString()}`, '#eab308', row.name, salesLabel, 'money'), align: 'right' },\n                transCol,\n                { label: 'Offer Discount', key: 'redemptionAmount', render: (v, row) => metricCell(row.id, 'redemptionAmount', `$${v.toLocaleString()}`, '#c73b32', row.name, 'Offer Discount', 'money'), align: 'right' },\n                { label: avgLabel, key: null, render: (v, row) => metricCell(row.id, 'avgCheck', `$${avgCheckOf(row).toFixed(2)}`, '#22a08a', row.name, avgLabel, 'moneyc'), align: 'right' },\n                { label: 'Action(s)', key: null, align: 'center', render: (x, row) => actionCell([rowActions(dim, row)]) }\n            ];\n        }\n\n        const campaignCols = [\n            { label: 'Campaign ID',        key: 'id',                render: v => v },\n            { label: 'Campaign Name',      key: 'name',              render: v => `<span class=\"font-semibold text-gray-900\">${v}<\u002Fspan>` },\n            { label: 'Offer Attached',     key: 'offer',             render: v => v },\n            { label: 'Customers Targeted',     key: 'users',             render: (v, row) => metricCell(row.id, 'users', v.toLocaleString(), '#2c8ec8', row.name, 'Customers Targeted', 'count'), align: 'right' },\n            { label: 'Customers Reached',     key: 'reached',             render: (v, row) => metricCell(row.id, 'reached', v.toLocaleString(), '#7b42ff', row.name, 'Customers Reached', 'count'), align: 'right' },\n            { label: 'Net Sales',     key: 'netSales',             render: (v, row) => metricCell(row.id, 'netSales', `$${v.toLocaleString()}`, '#0078a8', row.name, 'Net Sales', 'money'), align: 'right' },\n            { label: 'Campaign Sales',   key: 'salesOffer',        render: (v, row) => metricCell(row.id, 'salesOffer', `$${v.toLocaleString()}`, '#eab308', row.name, 'Campaign Sales', 'money'), align: 'right' },\n            { label: 'Campaign Trans.',     key: 'loyaltyTrans',      render: (v, row) => metricCell(row.id, 'loyaltyTrans', v.toLocaleString(), '#6b6ab9', row.name, 'Campaign Transactions', 'count'), align: 'right' },\n            { label: 'Offer Discount', key: 'redemptionAmount', render: (v, row) => metricCell(row.id, 'redemptionAmount', `$${v.toLocaleString()}`, '#c73b32', row.name, 'Offer Discount', 'money'), align: 'right' },\n            { label: 'Avg. Campaign Check', key: null, render: (v, row) => metricCell(row.id, 'avgCheck', `$${avgCheckOf(row).toFixed(2)}`, '#22a08a', row.name, 'Avg. Campaign Check', 'moneyc'), align: 'right' },\n            { label: 'Action(s)', key: null, align: 'center', render: (v, row) => {\n                const eye = `<button type=\"button\" title=\"View Detail\" data-campaign-id=\"${row.id}\" onclick=\"openCampaignDetail('${row.id}')\" class=\"w-6 h-6 rounded-full flex items-center justify-center transition hover:brightness-95 flex-shrink-0\" style=\"background:#f5dde8; color:#8a2450;\"><svg width=\"12\" height=\"12\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z\"/><circle cx=\"12\" cy=\"12\" r=\"3\"/><\u002Fsvg><\u002Fbutton>`;\n                const vc = currentView().ctx || {}; const fromStore = vc.storeId || vc.week || vc.day;\n                return actionCell([rowActions('campaign', row)], fromStore ? '' : eye);\n            } }\n        ];\n\n        const offerCols = [\n            { label: 'Offer Name',         key: 'name',              render: v => `<span class=\"font-semibold text-gray-900\">${v}<\u002Fspan>` },\n            { label: 'Customers Targeted',     key: 'users',             render: (v, row) => metricCell(row.id, 'users', v.toLocaleString(), '#2c8ec8', row.name, 'Customers Targeted', 'count'), align: 'right' },\n            { label: 'Offer Sales',   key: 'salesOffer',        render: (v, row) => metricCell(row.id, 'salesOffer', `$${v.toLocaleString()}`, '#eab308', row.name, 'Offer Sales', 'money'), align: 'right' },\n            { label: 'Offer Transactions',     key: 'loyaltyTrans',      render: (v, row) => metricCell(row.id, 'loyaltyTrans', v.toLocaleString(), '#6b6ab9', row.name, 'Offer Transactions', 'count'), align: 'right' },\n            { label: 'Offer Discount', key: 'redemptionAmount', render: (v, row) => metricCell(row.id, 'redemptionAmount', `$${v.toLocaleString()}`, '#c73b32', row.name, 'Offer Discount', 'money'), align: 'right' },\n            { label: 'Offer Redemption Rate', key: null, render: (v, row) => metricCell(row.id, 'redemptionRate', `${redemptionRateOf(row).toFixed(1)}%`, '#0078a8', row.name, 'Offer Redemption Rate', 'percent'), align: 'right' },\n            { label: 'Avg. Offer Check', key: null, render: (v, row) => metricCell(row.id, 'avgCheck', `$${avgCheckOf(row).toFixed(2)}`, '#7b42ff', row.name, 'Avg. Offer Check', 'moneyc'), align: 'right' },\n            { label: 'Action(s)', key: null, align: 'center', render: (v, row) => {\n                const eye = `<button type=\"button\" title=\"View Detail\" data-offer-id=\"${row.id}\" onclick=\"openOfferDetail('${row.id}')\" class=\"w-6 h-6 rounded-full flex items-center justify-center transition hover:brightness-95 flex-shrink-0\" style=\"background:#f5dde8; color:#8a2450;\"><svg width=\"12\" height=\"12\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z\"/><circle cx=\"12\" cy=\"12\" r=\"3\"/><\u002Fsvg><\u002Fbutton>`;\n                return actionCell([rowActions('campaign', row)], eye);\n            } }\n        ];\n\n        const labelWithSub = (v, row) => `<span class=\"font-semibold text-gray-900\">${v}<\u002Fspan><br><span class=\"text-[11px] text-gray-400 font-normal\">${row.sub}<\u002Fspan>`;\n\n        // Pivot drill: every level can break down by any other dimension.\n        // Each drillPath step = { dim, sel, ctx } where ctx = { rootId?, storeId?, week? } filters.\n        let ROW_REG = [];\n        function rootDimLabel() { return currentTab === 'campaign' ? 'Campaigns' : 'Offers'; }\n        function dimTitle(d) { return d === 'campaign' ? (currentTab === 'campaign' ? 'Break down by campaign' : 'Break down by offer') : 'Break down by ' + d; }\n        function currentView() { return drillPath.length ? drillPath[drillPath.length - 1] : { dim: 'campaign', ctx: {} }; }\n        function rowActions(viewDim, row) {\n            const k = ROW_REG.push(row) - 1;\n            const targets = viewDim === 'day' ? ['campaign', 'store'] : ['campaign', 'store', 'week', 'day'].filter(d => d !== viewDim);\n            return targets.map(d => drillIcon(d, dimTitle(d), `drillTo('${d}', ${k})`)).join('');\n        }\n        function weekOverlap(weeks, wk) { return weeks.find(w => w._from <= wk.to && w._to >= wk.from) || null; }\n        function withMetrics(row, src) { const out = { ...row }; METRIC_KEYS.forEach(m => { out[m] = src[m]; }); return out; }\n        function sliceFor(root, storeId, wk, day) {\n            let base = root;\n            if (storeId) { base = storesForRoot(root).find(s => s.id === storeId); if (!base) return null; }\n            if (day) {\n                const weekLike = wk ? weekOverlap(weeksForStore(root, base), wk) : { ...base, _from: root._ovFrom, _to: root._ovTo };\n                if (!weekLike) return null;\n                return daysForWeek(root, base, weekLike).find(d => d.id === day.id) || null;\n            }\n            return wk ? weekOverlap(weeksForStore(root, base), wk) : base;\n        }\n        function viewRows(view) {\n            const ctx = view.ctx || {};\n            if (view.dim === 'campaign') {\n                const roots = rootRowsForRange();\n                if (!ctx.storeId && !ctx.week && !ctx.day) return roots;\n                return roots.map(c => { const s = sliceFor(c, ctx.storeId, ctx.week, ctx.day); return s ? withMetrics(c, s) : null; }).filter(Boolean);\n            }\n            const root = getRootRow(ctx.rootId);\n            if (!root) return [];\n            if (view.dim === 'store') {\n                const stores = storesForRoot(root);\n                if (!ctx.week && !ctx.day) return stores;\n                return stores.map(s => { const sl = sliceFor(root, s.id, ctx.week, ctx.day); return sl ? withMetrics(s, sl) : null; }).filter(Boolean);\n            }\n            const base = ctx.storeId ? storesForRoot(root).find(s => s.id === ctx.storeId) : root;\n            if (!base) return [];\n            if (view.dim === 'week') return weeksForStore(root, base);\n            if (ctx.week) { const w = weekOverlap(weeksForStore(root, base), ctx.week); return w ? daysForWeek(root, base, w) : []; }\n            return daysForWeek(root, base, { ...base, _from: root._ovFrom, _to: root._ovTo });\n        }\n        function drillTo(target, k) {\n            const row = ROW_REG[k];\n            if (!row) return;\n            const view = currentView();\n            const ctx = { ...(view.ctx || {}) };\n            if (view.dim === 'campaign') ctx.rootId = row.id;\n            else if (view.dim === 'store') ctx.storeId = row.id;\n            else if (view.dim === 'week') ctx.week = { id: row.id, from: row._from, to: row._to, name: row.name };\n            else if (view.dim === 'day') ctx.day = { id: row.id, name: row.name };\n            if (target === 'campaign') delete ctx.rootId;\n            if (target === 'store') delete ctx.storeId;\n            if (target === 'week') delete ctx.week;\n            if (target === 'day') delete ctx.day;\n            drillPath.push({ dim: target, sel: row.name, ctx });\n            paginationState.page = 1;\n            renderBreadcrumb();\n            renderTable();\n        }\n\n        function resetDrill() {\n            drillPath = [];\n            paginationState.page = 1;\n            renderBreadcrumb();\n            renderTable();\n        }\n\n        function goToDrillStep(idx) {\n            drillPath = drillPath.slice(0, idx + 1);\n            paginationState.page = 1;\n            renderBreadcrumb();\n            renderTable();\n        }\n\n        // Jump directly to a breakdown level via the persistent tab row.\n        // Carries forward whatever campaign/offer, store and week is already selected;\n        // if nothing is selected yet, defaults to the first one active in the date range\n        // so the tab always has something concrete to show. Same logic for both paths.\n        function goToDimLevel(dim) {\n            const view = currentView();\n            if (dim === 'campaign') { resetDrill(); return; }\n            if (view.dim === dim) return;\n            const ctx = { ...(view.ctx || {}) };\n            let fresh = false;\n            if (!ctx.rootId) { const r = rootRowsForRange()[0]; if (!r) return; ctx.rootId = r.id; fresh = true; }\n            if (dim === 'store') delete ctx.storeId;\n            if (dim === 'week') delete ctx.week;\n            if (fresh || !drillPath.length) {\n                const r = getRootRow(ctx.rootId);\n                drillPath = [{ dim, sel: r ? r.name : '', ctx }];\n            } else {\n                drillPath[drillPath.length - 1] = { ...drillPath[drillPath.length - 1], dim, ctx };\n            }\n            paginationState.page = 1;\n            renderBreadcrumb();\n            renderTable();\n        }\n\n        function renderBreadcrumb() {\n            const wrap = document.getElementById('drill-breadcrumb');\n            if (!wrap) return;\n\n            // First level tab follows the Campaign / Offers toggle\n            const isCampaign = currentTab === 'campaign';\n            const rootLabel = document.getElementById('dim-root-label');\n            if (rootLabel) rootLabel.textContent = isCampaign ? 'Marketing Performance' : 'Offers';\n            const icC = document.getElementById('dim-root-icon-campaign');\n            const icO = document.getElementById('dim-root-icon-offers');\n            if (icC) { icC.classList.toggle('hidden', !isCampaign); icC.classList.toggle('inline-flex', isCampaign); }\n            if (icO) { icO.classList.toggle('hidden', isCampaign); icO.classList.toggle('inline-flex', !isCampaign); }\n\n            // Sync active tab state to the current drill depth\n            const activeDim = drillPath.length === 0 ? 'campaign' : drillPath[drillPath.length - 1].dim;\n            ['campaign', 'store', 'week', 'day'].forEach(d => {\n                const btn = document.getElementById('dim-tab-' + d);\n                if (btn) btn.classList.toggle('active', d === activeDim);\n            });\n\n            if (!drillPath.length) {\n                wrap.innerHTML = '';\n                return;\n            }\n            const link = (txt, js) => `<span class=\"cursor-pointer text-gray-500 hover:text-[#9b2c5c] hover:underline\" onclick=\"${js}\">${txt}<\u002Fspan>`;\n            const sep = '<span class=\"text-gray-300 mx-1.5\">/<\u002Fspan>';\n            const root = link(rootDimLabel(), 'resetDrill()');\n            const lastIdx = drillPath.length - 1;\n            const lastDim = drillPath[lastIdx].dim;\n            const steps = drillPath.map((step, i) => sep + (i < lastIdx ? link(step.sel, `goToDrillStep(${i})`) : `<span class=\"text-gray-500\">${step.sel}<\u002Fspan>`)).join('')\n                + sep + `<span class=\"font-semibold text-gray-900\">${lastDim === 'campaign' ? rootDimLabel() : ({ store: 'Stores', week: 'Weeks', day: 'Days' })[lastDim]}<\u002Fspan>`;\n            wrap.innerHTML = `<div class=\"flex items-center flex-wrap text-xs text-gray-500\">${root}${steps}\n                <button onclick=\"resetDrill()\" class=\"ml-3 px-2.5 py-1 rounded-md border border-gray-200 text-xs font-semibold text-gray-600 hover:border-[#9b2c5c] hover:text-[#9b2c5c] transition bg-white\">Clear<\u002Fbutton>\n            <\u002Fdiv>`;\n        }\n\n        function tableAllFilteredRows() {\n            let data = [];\n            data = viewRows(currentView());\n            const q = (document.getElementById('table-search').value || '').trim().toLowerCase();\n            return q\n                ? data.filter(r => Object.keys(r).some(k => k.charAt(0) !== '_' && String(r[k]).toLowerCase().includes(q)))\n                : data;\n        }\n        function tableTotalPages() {\n            const total = tableAllFilteredRows().length;\n            return Math.max(1, Math.ceil(total / paginationState.pageSize));\n        }\n\n        function tableGoToPage(page) {\n            const totalPages = tableTotalPages();\n            if (page < 1) page = 1;\n            if (page > totalPages) page = totalPages;\n            paginationState.page = page;\n            renderTable();\n        }\n\n        function renderPaginationControls() {\n            const totalPages = tableTotalPages();\n            if (paginationState.page > totalPages) paginationState.page = totalPages;\n            if (paginationState.page < 1) paginationState.page = 1;\n\n            document.getElementById('pg-page-number').textContent = paginationState.page;\n            const atFirst = paginationState.page <= 1;\n            const atLast = paginationState.page >= totalPages;\n            document.getElementById('pg-first').disabled = atFirst;\n            document.getElementById('pg-prev').disabled = atFirst;\n            document.getElementById('pg-next').disabled = atLast;\n            document.getElementById('pg-last').disabled = atLast;\n        }\n\n        function currentCols() {\n            const v = currentView();\n            if (v.dim === 'campaign') {\n                if (currentTab !== 'campaign') return offerCols;\n                // Campaigns reached from a store/week/day row: hide audience columns\n                if (v.ctx && (v.ctx.storeId || v.ctx.week || v.ctx.day)) return campaignCols.filter(c => c.key !== 'users' && c.key !== 'reached');\n                return campaignCols;\n            }\n            return metricCols(v.dim);\n        }\n\n        let selectedStores = null; // null = all\n        function storeSelLabel() {\n            if (!selectedStores || selectedStores.length === STORE_DEFS.length) return 'All stores';\n            if (selectedStores.length === 0) return 'No stores';\n            const names = STORE_DEFS.filter(s => selectedStores.includes(s.id));\n            if (names.length === 1) return 'Store ' + names[0].sub;\n            if (names.length === 2) return 'Stores ' + names.map(s => s.sub).join(', ');\n            return names.length + ' stores selected';\n        }\n        function applyStoreSel() {\n            const l = storeSelLabel();\n            document.getElementById('scope-label').textContent = l;\n            updateKpis();\n            onDateRangeChanged();\n            const sel = STORE_DEFS.filter(s => selectedStores && selectedStores.includes(s.id));\n            document.getElementById('store-btn-label').textContent = (!selectedStores || selectedStores.length === STORE_DEFS.length) ? 'All stores' : !sel.length ? 'No stores' : sel.length <= 2 ? sel.map(s => s.sub).join(', ') : sel.length + ' stores selected';\n        }\n        function renderStorePanel() {\n            const all = !selectedStores || selectedStores.length === STORE_DEFS.length;\n            const row = (id, text, sub, checked) => '<label class=\"flex items-center gap-3 px-4 py-2 cursor-pointer hover:bg-gray-50\"><input type=\"checkbox\" class=\"w-4 h-4 cursor-pointer\" data-store=\"' + id + '\"' + (checked ? ' checked' : '') + ' onchange=\"onStoreCheck(this)\"><span class=\"text-sm text-gray-800 font-semibold\">' + text + '<\u002Fspan>' + (sub ? '<span class=\"text-xs text-gray-500\">' + sub + '<\u002Fspan>' : '') + '<\u002Flabel>';\n            document.getElementById('store-panel').innerHTML = row('ALL', 'All', '', all) + '<div class=\"border-t border-gray-100 my-1\"><\u002Fdiv>' + STORE_DEFS.map(s => row(s.id, s.sub, '', all || selectedStores.includes(s.id))).join('');\n        }\n        function onStoreCheck(el) {\n            const id = el.dataset.store;\n            if (id === 'ALL') selectedStores = el.checked ? null : [];\n            else {\n                let cur = selectedStores ? selectedStores.slice() : STORE_DEFS.map(s => s.id);\n                cur = el.checked ? cur.concat(id) : cur.filter(x => x !== id);\n                selectedStores = cur.length === STORE_DEFS.length ? null : cur;\n            }\n            renderStorePanel(); applyStoreSel();\n        }\n        function toggleStorePanel(e) {\n            if (e) e.stopPropagation();\n            const p = document.getElementById('store-panel');\n            if (p.classList.contains('hidden')) renderStorePanel();\n            p.classList.toggle('hidden');\n        }\n        document.addEventListener('click', e => {\n            const p = document.getElementById('store-panel');\n            if (p && !p.classList.contains('hidden') && !p.contains(e.target)) p.classList.add('hidden');\n        });\n        function toggleCardTrends(on) {\n            document.getElementById('dashboard-home').classList.toggle('no-trends', !on);\n            if (on) renderKpiTileSparklines();\n        }\n        function toggleTableSparklines(on) {\n            document.getElementById('dashboard-home').classList.toggle('no-table-spark', !on);\n        }\n        function updateBreakdownMeta(rows, cols) {\n            const t = document.getElementById('bd-title'); if (!t) return;\n            const dim = currentView().dim;\n            t.textContent = 'Breakdown by ' + ((dim || 'campaign').charAt(0).toUpperCase() + (dim || 'campaign').slice(1));\n            \n            const nc = cols.find(c => /^net sales/i.test(c.label));\n            const strip = s => String(s).replace(/<[^>]*>/g, '').trim();\n            const top = rows.slice(0, 3);\n            const _wl = top.length\n                ? '<span class=\"text-[11px] font-bold tracking-wider text-gray-500 uppercase\">Watchlist · ' + top.length + ' of ' + rows.length + '<\u002Fspan>' + top.map(r => {\n                    const c0 = cols[0];\n                    const name = strip(c0.render(c0.key ? r[c0.key] : null, r));\n                    const raw = nc && nc.key ? String(r[nc.key]) : '';\n                    const val = raw && raw.indexOf('<') < 0 ? raw : '';\n                    return '<div class=\"border border-gray-200 rounded-lg px-4 py-2.5 bg-white\"><div class=\"text-sm font-semibold text-gray-900\">' + name + '<\u002Fdiv>' + (val ? '<div class=\"text-[15px] font-semibold text-[#9b2c5c]\">' + val + '<\u002Fdiv>' : '') + '<\u002Fdiv>';\n                }).join('')\n                : '';\n        }\n\n        function renderTable() {\n            ROW_REG = [];\n            const cols = currentCols();\n            const allRows = tableAllFilteredRows();\n            updateBreakdownMeta(allRows, cols);\n\n            // Paginate\n            const totalPages = Math.max(1, Math.ceil(allRows.length / paginationState.pageSize));\n            if (paginationState.page > totalPages) paginationState.page = totalPages;\n            if (paginationState.page < 1) paginationState.page = 1;\n            const startIdx = (paginationState.page - 1) * paginationState.pageSize;\n            const rows = allRows.slice(startIdx, startIdx + paginationState.pageSize);\n\n            // Header\n            document.getElementById('table-head').innerHTML = '<tr>' + cols.map(c => {\n                const align = c.align === 'right' ? 'text-right' : c.align === 'center' ? 'text-center' : 'text-left';\n                return `<th class=\"px-2.5 py-2.5 ${align}\">${c.label}<\u002Fth>`;\n            }).join('') + '<\u002Ftr>';\n\n            // Body\n            const tbody = document.getElementById('table-body');\n            const emptyMsg = document.getElementById('table-empty');\n            if (!rows.length) {\n                tbody.innerHTML = '';\n                const hasQuery = (document.getElementById('table-search').value || '').trim().length > 0;\n                emptyMsg.textContent = hasQuery\n                    ? 'No results match your search.'\n                    : 'No ' + (currentTab === 'campaign' ? 'campaigns' : 'offers') + ' were active in the selected date range.';\n                emptyMsg.classList.remove('hidden');\n                renderPaginationControls();\n                return;\n            }\n            emptyMsg.classList.add('hidden');\n            tbody.innerHTML = rows.map(row => {\n                return '<tr class=\"hover:bg-gray-50 transition\">' + cols.map(c => {\n                    const align = c.align === 'right' ? 'text-right' : c.align === 'center' ? 'text-center' : 'text-left';\n                    const val = c.key ? row[c.key] : null;\n                    return `<td class=\"px-2.5 py-2.5 ${align}\">${c.render(val, row)}<\u002Ftd>`;\n                }).join('') + '<\u002Ftr>';\n            }).join('');\n\n            renderPaginationControls();\n            rollTableNumbers();\n\n            // Refresh Lucide icons in newly-inserted content (Action column has data-lucide)\n            if (typeof lucide !== 'undefined' && typeof lucide.createIcons === 'function') {\n                try { lucide.createIcons(); } catch (e) { renderIconsFallback(); }\n            } else {\n                renderIconsFallback();\n            }\n        }\n\n        function togglePageSizePanel(e) {\n            if (e) e.stopPropagation();\n            const panel = document.getElementById('pg-size-panel');\n            const btn = document.getElementById('pg-size-btn');\n            const isOpen = !panel.classList.contains('hidden');\n            if (isOpen) {\n                panel.classList.add('hidden');\n                btn.classList.remove('ring-2', 'ring-[#9b2c5c]', 'border-[#9b2c5c]');\n                btn.classList.add('border-gray-300');\n            } else {\n                renderPageSizeOptions();\n                panel.classList.remove('hidden');\n                btn.classList.remove('border-gray-300');\n                btn.classList.add('ring-2', 'ring-[#9b2c5c]', 'border-[#9b2c5c]');\n            }\n        }\n\n        function renderPageSizeOptions() {\n            document.querySelectorAll('.pg-size-opt').forEach(opt => {\n                const size = parseInt(opt.dataset.size, 10);\n                if (size === paginationState.pageSize) {\n                    opt.className = 'pg-size-opt w-full text-center py-1.5 text-sm font-bold bg-blue-500 text-white transition';\n                } else {\n                    opt.className = 'pg-size-opt w-full text-center py-1.5 text-sm font-semibold text-[#c73b32] hover:bg-gray-50 transition';\n                }\n            });\n        }\n\n        function setPageSize(size) {\n            paginationState.pageSize = size;\n            paginationState.page = 1;\n            document.getElementById('pg-size-label').textContent = String(size);\n            document.getElementById('pg-size-panel').classList.add('hidden');\n            const btn = document.getElementById('pg-size-btn');\n            btn.classList.remove('ring-2', 'ring-[#9b2c5c]', 'border-[#9b2c5c]');\n            btn.classList.add('border-gray-300');\n            renderTable();\n        }\n\n        funct
